<!-- ============ FORGOT PASSWORD (§13) ============ -->
<sc-if value="{{ isForgot }}" hint-placeholder-val="{{ false }}">
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:44px 28px;background:#0A0B14">
  <div style="width:400px;max-width:100%;background:#12141F;border:1px solid #23263c;border-radius:12px;padding:30px">
    <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:#00C9C8;font-weight:600;margin-bottom:12px">RESET PASSWORD</div>
    <div style="font-family:'Playfair Display',serif;font-weight:800;font-size:26px;color:#F7F1E8;margin-bottom:6px">Lost the thread.</div>
    <div style="font-size:13px;color:#7d7f96;line-height:1.5;margin-bottom:20px">Drop your email and we will send a magic link to get you back on the road.</div>
    <div style="background:#16182a;border:1px solid #2b2f52;border-radius:6px;padding:11px 13px;font-size:13px;color:#7d7f96;margin-bottom:12px">you@somewhere.com</div>
    <div style="font-size:13px;color:#06302f;background:#00C9C8;padding:11px;border-radius:6px;font-weight:700;text-align:center;cursor:pointer;margin-bottom:14px">Send the magic link →</div>
    <div onClick="{{ goLogin }}" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#4a4d63;text-align:center;cursor:pointer">← Back to log in</div>
  </div>
</div>
</sc-if>
