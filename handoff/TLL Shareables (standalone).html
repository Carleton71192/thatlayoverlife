document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

@keyframes tllWalk{0%{transform:translateX(0) scaleX(-1)}48%{transform:translateX(470px) scaleX(-1)}50%{transform:translateX(470px) scaleX(1)}98%{transform:translateX(0) scaleX(1)}100%{transform:translateX(0) scaleX(-1)}}\n@keyframes tllSpin{to{transform:rotate(360deg)}}\n<\u002Fstyle><\u002Fhelmet>\n{{ mapDefs }}<div style=\"padding:70px 80px 120px;display:flex;flex-direction:column;gap:100px;width:max-content;font-family:'IBM Plex Sans Condensed',sans-serif;color:#0A0B14\">\n<div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:.2px;color:var(--ink);white-space:nowrap\"><span style=\"font-style:italic;opacity:.65;font-weight:700\">that<\u002Fspan>LAYOVER <span style=\"color:#F0507A\">LIFE.<\u002Fspan><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.5px;color:#6B6660;font-weight:800\">SHAREABLES · PHASE 1 · 28 SEPTEMBER 2026 · SAMPLE DATA THROUGHOUT<\u002Fspan><\u002Fdiv>\n<section id=\"s00\" style=\"display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;align-items:baseline;gap:18px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;color:#067A79;font-weight:800\">00<\u002Fspan><div><div style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:36px;line-height:1.05;color:#0A0B14\">Shareables. <span style=\"color:#F0507A;font-style:italic\">Honest trophies.<\u002Fspan><\u002Fdiv><div style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15.5px;color:#3a3a3a;margin-top:7px;max-width:920px;line-height:1.5\">Five artifacts members actually want to post, all counted against one named base, all private until the member says otherwise. The duo card is the one no other travel app has, so it leads. Every number on this board is sample data bound to the Tweaks panel: switch the counting base, turn on ranges, hide the airside stat, and every card updates.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;max-width:2400px\"><div style=\"flex:none;width:620px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">THE COUNTING RULE · LAYOVER TIER LADDER<\u002Fdiv><div style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:24px;line-height:1.15;margin-bottom:12px\">Layovers don't count. <span style=\"color:#C8425E;font-style:italic\">Leaving the airport does.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px 90px 1fr 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #E0DACE;font-size:14px\"><span style=\"width:34px;height:22px;border-radius:3px;background:var(--land);border:1.5px dashed var(--ink);box-sizing:border-box;--rose:#F0507A;--lived:#D63859;--ink:#0A0B14;--land:#E4DCCD\"><\u002Fspan><b style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:17px\">Airside<\u002Fb><span>Touched the terminal only<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:#C8425E\">NO. FLEX STAT INSTEAD<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px 90px 1fr 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #E0DACE;font-size:14px\"><span style=\"width:34px;height:22px;border-radius:3px;background:var(--rose);--rose:#F0507A;--lived:#D63859;--ink:#0A0B14;--land:#E4DCCD\"><\u002Fspan><b style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:17px\">Escaped<\u002Fb><span>Left the airport, station or port<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:#067A79\">YES. THE MINIMUM<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px 90px 1fr 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #E0DACE;font-size:14px\"><span style=\"width:34px;height:22px;border-radius:3px;background:var(--rose);box-shadow:inset 0 0 0 2px #FAF7F2,inset 0 0 0 3px #F0507A;--rose:#F0507A;--lived:#D63859;--ink:#0A0B14;--land:#E4DCCD\"><\u002Fspan><b style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:17px\">Fed<\u002Fb><span>Ate a meal outside<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:#067A79\">YES<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px 90px 1fr 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #E0DACE;font-size:14px\"><span style=\"width:34px;height:22px;border-radius:3px;background:var(--rose);box-shadow:inset 0 0 0 2px #FAF7F2,inset 0 0 0 3px #F0507A,inset 0 0 0 5px #FAF7F2,inset 0 0 0 6px #F0507A;--rose:#F0507A;--lived:#D63859;--ink:#0A0B14;--land:#E4DCCD\"><\u002Fspan><b style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:17px\">Slept<\u002Fb><span>Overnight outside<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:#067A79\">YES<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:40px 90px 1fr 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #E0DACE;font-size:14px\"><span style=\"width:34px;height:22px;border-radius:3px;background:var(--lived);box-shadow:inset 0 0 0 1.5px var(--ink);--rose:#F0507A;--lived:#D63859;--ink:#0A0B14;--land:#E4DCCD\"><\u002Fspan><b style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:17px\">Lived<\u002Fb><span>Long stay<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;color:#067A79\">YES<\u002Fspan><\u002Fdiv><div style=\"font-size:13px;color:#3a3a3a;margin-top:12px;line-height:1.5\">Pets follow the same rule: paws on the ground outside the vehicle or terminal. The cargo hold is the canine Airside. Stamps change shape with the tier: single border for Escaped, double for Fed, triple for Slept, heavy for Lived, dashed for Airside.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:470px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">HEADLINE BASE · LIVE FROM TWEAKS<\u002Fdiv><div style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:30px;line-height:1.05\">{{ h.denLabel }}<\u002Fdiv><div style=\"font-size:14px;line-height:1.55;margin-top:12px\">Sample traveler: 62 UN states plus 4 bonus places (Taiwan, New Caledonia, Kosovo, Antarctica).<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700\"><span>UN 193 · 62 / 193 = 32% · RECOMMENDED<\u002Fspan><span style=\"color:#6B6660\">TLL CLASSIC 195 · 66 / 195 = 34%<\u002Fspan><span style=\"color:#6B6660\">BEEN-STYLE 250 · 66 / 250 = 26%<\u002Fspan><\u002Fdiv><div style=\"margin-top:14px;padding:12px 14px;background:#fff;border:1px dashed #c9b89a;border-radius:8px;font-size:13px;line-height:1.5\">The founder's own number is her call. Her stored count carries a corrupt \"undefined\" entry, so it gets cleaned before any public card ships. Nothing on this board prints her count.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:470px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">TWO COLOR BUGS, FIXED<\u002Fdiv><div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:44px;height:30px;background:#F0507A;border-radius:4px\"><\u002Fspan><span style=\"width:44px;height:30px;background:#067A79;border-radius:4px\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;color:#C8425E\">PROTANOPIA ΔE 1.4<\u002Fspan><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;margin-top:8px\">Rose and light teal turn the same grey for protanopes. They never separate two categories on their own: the second category always gets a 1 px Ink stroke plus hatch or dots.<\u002Fdiv><div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\"><span style=\"background:#F0507A;color:#fff;padding:6px 11px;border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;text-decoration:line-through\">WHITE ON ROSE 3.42<\u002Fspan><span style=\"background:#F0507A;color:#0A0B14;padding:6px 11px;border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800\">INK ON ROSE 5.73 ✓<\u002Fspan><span style=\"background:#D63859;color:#fff;padding:6px 11px;border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800\">WHITE ON #D63859 4.60 ✓<\u002Fspan><\u002Fdiv><div style=\"font-size:12.5px;color:#6B6660;line-height:1.5;margin-top:12px\">Rose on Cream is 3.20:1, so rose text on light cards only appears at headline size. Magnus's purple #7C5CBF is 4.7:1 on Cream and 3.7:1 on Dark, and always travels with a hatch and stroke.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:360px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">ON THIS BOARD<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:7px;font-size:14px\"><a href=\"#s01\">01 · Duo card (the hero)<\u002Fa><a href=\"#s02\">02 · Percent card<\u002Fa><a href=\"#s03\">03 · Map card<\u002Fa><a href=\"#s04\">04 · Passport<\u002Fa><a href=\"#s05\">05 · Pet passport + map<\u002Fa><a href=\"#s05b\">05B · Pack card (Magnus's friends)<\u002Fa><a href=\"#s06\">06 · Share flow (live)<\u002Fa><a href=\"#s07\">07 · Privacy panel (live)<\u002Fa><a href=\"#s08\">08 · Public share page<\u002Fa><a href=\"#s09\">09 · Empty, new and quiet states<\u002Fa><a href=\"#s10\">10 · Components, copy deck, decisions<\u002Fa><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#6B6660;margin-top:14px;line-height:1.6;font-weight:700\">MASTERS 540×960 CSS = 1080×1920 @2X · FEED 540×675 · LINK 600×315. FEED AND LINK ARE SEPARATE LAYOUTS, NOT CROPS.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section id=\"s01\" style=\"display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;align-items:baseline;gap:18px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;color:#067A79;font-weight:800\">01<\u002Fspan><div><div style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:36px;line-height:1.05;color:#0A0B14\">Duo card. <span style=\"color:var(--rose);font-style:italic\">Nobody else has this.<\u002Fspan><\u002Fdiv><div style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15.5px;color:#3a3a3a;margin-top:7px;max-width:920px;line-height:1.5\">Two hero numbers, one map. Human in rose, Magnus in striped purple with a stroke, so the pair still separates with no color vision at all. Shared countries get both.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:36px;align-items:flex-start;\"><div id=\"01A\" style=\"flex:none;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.2px;color:#3a3a3a\"><span style=\"background:#0A0B nt-size:36px;line-height:1.05;color:#0A0B14\">The system. <span style=\"color:var(--rose);font-style:italic\">Parts, words, open calls.<\u002Fspan><\u002Fdiv><div style=\"font-family:'IBM Plex Sans Condensed',sans-serif;font-size:15.5px;color:#3a3a3a;margin-top:7px;max-width:920px;line-height:1.5\">What Claude Code builds from, and what Nancy still has to decide.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;max-width:2400px\"><div style=\"flex:none;width:560px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">COMPONENTS<\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Card shell<\u002Fb><span>540×960 master, 540×675 feed, 600×315 link. Theme via CSS variables on the shell, grain overlay, 250 px safe zone.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Luggage-tag tick bar<\u002Fb><span>One tick per state in the base (193, 195 or 250). Visited ticks rose. Punch hole left.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Chips<\u002Fb><span>Ink on rose (count), neutral (bonus, continents), dashed (Airside), white on purple (pet).<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Stamp set<\u002Fb><span>UN square, territory rounded, continent circle, Antarctica triangle, Airside dashed. Border weight encodes Escaped, Fed, Slept, Lived. Pictogram top right: plane, train, boat, car.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>MRZ strip<\u002Fb><span>Two lines of 44 characters in JetBrains Mono with \"&lt;\" filler. Count, percent, member year and jokes only.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Paw ring<\u002Fb><span>13 paw prints on a circle. Never stars.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Map<\u002Fb><span>Equal Earth, clipped near 60°S, precomputed once. Rose fill, Lived darker with Ink stroke, Airside dotted, tiny countries dot and ring, pet stripes plus stroke.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Antarctica badge<\u002Fb><span>Teal triangle, \"ATA WILD CARD\". Counts as a continent and a bonus place, never in the UN number.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Privacy panel<\u002Fb><span>Three levels, five item switches, ranges, the never-shown list.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Share sheet states<\u002Fb><span>Make my card, preview + export menu, OS sheet, toast, link-only, download + copy, render failed.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Wordmark footer<\u002Fb><span>Wordmark, \"Make yours at thatlayover.life\", short URL and QR on every image.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:620px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">COPY DECK · FINAL STRINGS<\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Card headline<\u002Fb><span>You didn't ask. Here are my travel stats anyway.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Card headline<\u002Fb><span>One more country, then you.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Percent<\u002Fb><span>{pct}% of the world. The other {100-pct}% has been warned.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Card headline<\u002Fb><span>Not bragging. Documenting.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Card headline<\u002Fb><span>Layovers don't count. I left the airport.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Cover<\u002Fb><span>Customs has seen things.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Map<\u002Fb><span>Where I've been. Where I'm going is none of your business.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Map<\u002Fb><span>Rose means been there. Blank means working on it.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Airside<\u002Fb><span>+{n} countries seen through glass.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Pet<\u002Fb><span>{n} countries, paws down.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Pet<\u002Fb><span>He's been to {n} countries. You've been to the couch.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Pet<\u002Fb><span>Better traveled than your ex.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Pet<\u002Fb><span>Good boy. Great passport.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Duo<\u002Fb><span>Me: {a}. Him: {b}. He's catching up.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Duo<\u002Fb><span>Travel buddy. Zero complaints about the aisle seat.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Duo<\u002Fb><span>One of us sheds. It's not me.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Quiet year<\u002Fb><span>0 new countries. 100% couch. Still counts as self-care.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Quiet year<\u002Fb><span>This year I traveled emotionally.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>New member<\u002Fb><span>Two countries in. Everybody starts somewhere. Usually an airport.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Export · Story<\u002Fb><span>Flex it (Story)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Export · Feed<\u002Fb><span>Grid it<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Export · Link<\u002Fb><span>Send the link. Be subtle.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Export · Download<\u002Fb><span>Save it for strategic bragging later<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Export · Group chat<\u002Fb><span>Drop it in the group chat<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Export · Cancel<\u002Fb><span>Not today, Instagram<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Share text<\u002Fb><span>You didn't ask to see my travel stats but here they are: {url}<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Toast<\u002Fb><span>Sent. Your mutuals have been notified. Emotionally.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Invite (every card)<\u002Fb><span>Make yours at thatlayover.life<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Privacy title<\u002Fb><span>Who gets to see this?<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Privacy · Off<\u002Fb><span>Just me (the default, obviously)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Privacy · Unlisted<\u002Fb><span>Anyone with the link<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Privacy · Public<\u002Fb><span>The whole internet. Bold.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Privacy · Ranges<\u002Fb><span>Show ranges, not exact numbers. Mysterious.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Error · render<\u002Fb><span>Card didn't render. Even images need a layover. Try again.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Error · no share<\u002Fb><span>Your browser won't share. Download it like it's 2009.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Tiers (samples)<\u002Fb><span>10 Carry-On · 25 Checked Bag · 50 Half the Stamps · 100 Centurion · 193 UN-Done<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#6B6660;margin-top:10px\">No em dashes anywhere. US spelling. Riff in the same register, keep it short.<\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:540px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">OPEN DECISIONS FOR NANCY<\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Founder's headline count<\u002Fb><span>UN 193 (recommended), TLL classic 195 or Been-style 250. Clean the corrupt \"undefined\" entry first, whatever the choice.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Final tier names<\u002Fb><span>Carry-On, Checked Bag, Half the Stamps, Centurion, UN-Done are samples. \"Half the Stamps\" at 50 is not half of 193.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Is Airside self-reported?<\u002Fb><span>Or does Escaped need a photo? Self-report is simpler and matches how members already log the map.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Magnus's count<\u002Fb><span>Stored as 13. Under UN 193 he is 12 plus Kosovo as a bonus. His list has no Denmark, where he lives: add it?<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Companion purple<\u002Fb><span>#7C5CBF passes on both themes and stays distinct from rose for red-green color blindness in my check, but it always carries stripes and a stroke. Confirm the hex.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Map data migration<\u002Fb><span>Today each country stores lived, visited or layover. The ladder needs airside, escaped, fed, slept, lived. Visited becomes Escaped. Layover is ambiguous: ask members, or default to Escaped so nobody's count drops overnight.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Stamp years<\u002Fb><span>Every year on this board is a placeholder. Real cards read years from the member's data.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Parks total<\u002Fb><span>\"63 US national parks\" is commonly cited but not verified against nps.gov. The parks switch shows a sample number until it is.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Legal review<\u002Fb><span>A short GDPR check on public travel-history profiles before Public goes live.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:170px 1fr;gap:14px;padding:8px 0;border-top:1px solid #E0DACE;font-size:13.5px;line-height:1.45\"><b>Link previews<\u002Fb><span>Per-member preview images need a small server route (Webflow Cloud or a CMS sync). Ship downloadable cards first.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"flex:none;width:460px;background:#FDF9F3;color:#0A0B14;border:1px solid #E0DACE;border-radius:10px;padding:24px 26px;box-sizing:border-box;font-family:'IBM Plex Sans Condensed',sans-serif\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">ALT TEXT · GENERATED FROM THE DATA<\u002Fdiv><div style=\"padding:8px 0;border-top:1px solid #E0DACE\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#067A79;font-weight:800\">PERCENT<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;margin-top:3px\">{{ alt.percent }}<\u002Fdiv><\u002Fdiv><div style=\"padding:8px 0;border-top:1px solid #E0DACE\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#067A79;font-weight:800\">MAP<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;margin-top:3px\">{{ alt.map }}<\u002Fdiv><\u002Fdiv><div style=\"padding:8px 0;border-top:1px solid #E0DACE\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#067A79;font-weight:800\">PASSPORT<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;margin-top:3px\">{{ alt.passport }}<\u002Fdiv><\u002Fdiv><div style=\"padding:8px 0;border-top:1px solid #E0DACE\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#067A79;font-weight:800\">PET<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;margin-top:3px\">{{ alt.pet }}<\u002Fdiv><\u002Fdiv><div style=\"padding:8px 0;border-top:1px solid #E0DACE\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#067A79;font-weight:800\">DUO<\u002Fdiv><div style=\"font-size:13px;line-height:1.45;margin-top:3px\">{{ alt.duo }}<\u002Fdiv><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#067A79;font-weight:800;margin-bottom:10px\">BUILD NOTES<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;display:flex;flex-direction:column;gap:8px\"><div>Render in the browser with modern-screenshot (about 11 KB). Keep map geometry inline SVG, self-host the three fonts, wait for fonts, retry once if the image comes back tiny.<\u002Fdiv><div>Two taps: generate, then share. Fallbacks: link only, then download plus copy link.<\u002Fdiv><div>Sizes: 1080×1920 master, 1080×1350 feed, 1200×630 link preview under 300 KB, PNG or JPEG, never SVG.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;countBase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;UN 193 (recommended)&quot;,&quot;TLL classic 195&quot;,&quot;Been-style 250&quot;],&quot;default&quot;:&quot;UN 193 (recommended)&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Counting&quot;},&quot;showRanges&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Counting&quot;},&quot;showAirside&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Counting&quot;},&quot;safeGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas&quot;}}\">\nclass Component extends DCLogic {\n  state = { geo: null, qr: null, ranges: null, level: 'unlisted', items: { count: true, pct: true, map: true, dog: true, parks: false }, slug: 'k7f3q9', demo: 'idle', cardType: 'percent', sim: '', copied: false };\n  cardRefs = { percent: React.createRef(), map: React.createRef(), passport: React.createRef(), pet: React.createRef(), duo: React.createRef() };\n  HUMAN = ['076','276','203','703','040','008','688','100','752','807','348','616','208','704','840','499','288','392','484','152','032','578','246','528','056','250','724','620','380','300','191','705','070','642','826','372','756','233','428','440','504','818','710','404','764','116','360','702','458','608','410','036','554','124','604','170','188','192','470','442','196','356'];\n  LIVED = ['208','076','704','840'];\n  AIRSIDE = ['634','352','591','231'];\n  DOG = ['076','276','203','703','040','008','688','100','752','807','348','616'];\n  TWO = ['208','752'];\n  SMALL = { '702': [103.82, 1.35], '470': [14.44, 35.9] };\n  _maps = {}; _els = {}; _ticks = {};\n  componentDidMount() { this.loadGeo(); this.loadQr(); }\n  async loadGeo() {\n    try {\n      const d3 = await import('https://cdn.jsdelivr.net/npm/d3-geo@3/+esm');\n      const topo = await import('https://cdn.jsdelivr.net/npm/topojson-client@3/+esm');\n      const world = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')).json();\n      const all = topo.feature(world, world.objects.countries).features;\n      const feats = all.filter(f => String(f.id) !== '01
