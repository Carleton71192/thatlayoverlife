<!-- ============ THE MAP (§08) ============ -->
<sc-if value="{{ isMap }}" hint-placeholder-val="{{ false }}">
<div style="background:#0A0B14;min-height:100vh;padding:36px 28px 50px">
  <div style="max-width:1180px;margin:0 auto">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:#00C9C8;font-weight:600;margin-bottom:10px">THE MAP · THE LIFER CHASE, VISUALIZED</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div style="font-family:'Playfair Display',serif;font-weight:800;font-size:40px;line-height:1.02;color:#F7F1E8">Every country, <span style="color:#FF7093;font-style:italic">on the map.</span></div>
      <a href="{{ mapFullSrc }}" target="_top" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#06302f;background:#00C9C8;padding:9px 18px;border-radius:6px;font-weight:700">OPEN FULL SCREEN →</a>
    </div>
    <div style="border-radius:10px;overflow:hidden;border:1px solid #232744;background:#12141F">
      <iframe src="{{ mapSrc }}" title="The TLL world map" style="display:block;width:100%;height:1040px;border:0" loading="lazy"></iframe>
    </div>
  </div>
</div>
</sc-if>
