name = "tll-travel-wire"
main = "src/index.js"
compatibility_date = "2025-08-01"

# The scheduled job. Every 30 minutes, on the hour and the half hour.
[triggers]
crons = ["*/30 * * * *"]

# Where the wire is stored between runs.
# Run `npx wrangler kv namespace create WIRE_KV` and paste the id it prints here.
[[kv_namespaces]]
binding = "WIRE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Collections the story-published webhook reads (see src/story-hook.js).
# Secrets it also needs: STORY_HOOK_TOKEN, WEBFLOW_TOKEN, MEMBERSTACK_KEY.
# The member-updated webhook (src/profile-sync.js) also needs PROFILE_HOOK_TOKEN.
[vars]
STORIES_COLLECTION_ID = "6a0b29eddc14f1444e935760"
CONTRIBUTORS_COLLECTION_ID = "6a0b29c7a7b1840afe9390a5"
COUNTRIES_COLLECTION_ID = "6a8afbd98e907b41c4da109b"

# One-line log per cron run, readable with `npx wrangler tail`.
[observability]
enabled = true
