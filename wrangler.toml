name = "tll-travel-wire"
main = "src/index.js"
compatibility_date = "2025-08-01"

# The scheduled job. Every 30 minutes, on the hour and the half hour.
[triggers]
crons = ["*/30 * * * *"]

# Where the wire is stored between runs.
# The WIRE_KV namespace on the TLL Cloudflare account (id set 29 Oct 2026 from `npx wrangler kv namespace list`).
[[kv_namespaces]]
binding = "WIRE_KV"
id = "7f96e7f1c0c240dd8944a11c2348d903"

# Collections the story-published webhook reads (see src/story-hook.js).
# Secrets it also needs: STORY_HOOK_TOKEN, WEBFLOW_TOKEN, MEMBERSTACK_KEY.
# The member-updated webhook (src/profile-sync.js) also needs PROFILE_HOOK_TOKEN.
[vars]
STORIES_COLLECTION_ID = "6a0b29eddc14f1444e935760"
CONTRIBUTORS_COLLECTION_ID = "6a0b29c7a7b1840afe9390a5"
COUNTRIES_COLLECTION_ID = "6a8afbd98e907b41c4da109b"
# The site owner (Nancy). Only her map saves are stored for GET /owner-map, the visitors' map. A member id, not a secret.
OWNER_MEMBER_ID = "mem_cmqcj6qqo35ab0sn20bafhzh3"
# Site stats (src/site-stats.js): the one item the footer binds to; the 30-minute job recounts it.
PETS_COLLECTION_ID = "6a0be8194ccc05a63fbdcfa3"
# GET /expats-map reads the Directory (is-expat) beside Contributors (list-expats).
DIRECTORY_COLLECTION_ID = "6abcd638b10dc7b4930f6410"
# POST /intake and GET /lounge (src/intake.js).
DESTINATIONS_COLLECTION_ID = "6a0b29c702602326705dcfb1"
THEMES_COLLECTION_ID = "6a0c7e883607a3b091e1ae20"
PHOTO_PLACEMENTS_COLLECTION_ID = "6accbabf97231f9b5b985c55"
PHOTO_SUBMISSIONS_COLLECTION_ID = "6ad0840f0b87155745bb156d"
SITE_STATS_COLLECTION_ID = "6ae602821fa37291336b5680"
SITE_STATS_ITEM_ID = "6ae602fb1fa37291336b8715"

# One-line log per cron run, readable with `npx wrangler tail`.
[observability]
enabled = true
