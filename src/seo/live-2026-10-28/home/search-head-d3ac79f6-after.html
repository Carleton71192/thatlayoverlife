<div class="h3 h3-search-head"><p class="h3-ey" id="h3-search-t">Search it</p><p>Type a country. Your carry-on is already packed.</p></div><script id="h3-search-go">/* 28 Oct 2026: the Library search box is a Webflow form; Webflow tried to submit it as a form entry and showed its fail message. This sends the words straight to the Stories page search, which already reads ?q= (the Try links use it). */document.addEventListener('submit',function(e){var f=e.target;if(!f||f.getAttribute('data-name')!=='Library search')return;e.preventDefault();e.stopImmediatePropagation();var i=f.querySelector('input[type=text]');var q=i?i.value.trim():'';location.href='/stories'+(q?'?q='+encodeURIComponent(q):'');},true);</script>
