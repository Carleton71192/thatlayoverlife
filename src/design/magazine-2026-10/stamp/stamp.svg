<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="That Layover Life stamp: Curaçao, 12 October 2026, 12.17 degrees north, 68.99 degrees west">
  <!-- The stamp (26 Oct 2026). One device for the whole magazine: the title around the top, the coordinates around the bottom,
       place and date inside, the monogram. Ink on nothing; set color on the parent to recolor it (currentColor).
       The rough edge is an SVG filter, so the mark stays vector. Below about 64px drop the filter (class "clean") or it muddies.
       Text is JetBrains Mono, the one place the monospace survives. -->
  <defs>
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="top" d="M30,100 A70,70 0 1,1 170,100"/>
    <path id="bottom" d="M34,100 A66,66 0 0,0 166,100"/>
  </defs>
  <g class="stamp" filter="url(#ink)">
    <g fill="none" stroke="currentColor">
      <circle cx="100" cy="100" r="94" stroke-width="3"/>
      <circle cx="100" cy="100" r="86" stroke-width="1.2"/>
      <circle cx="100" cy="100" r="58" stroke-width="1.2"/>
    </g>
    <g fill="currentColor" font-family="'JetBrains Mono',ui-monospace,monospace" text-anchor="middle">
      <text font-size="12.5" font-weight="600" letter-spacing="3"><textPath href="#top" startOffset="50%">THAT LAYOVER LIFE</textPath></text>
      <text font-size="10.5" letter-spacing="2.2"><textPath href="#bottom" startOffset="50%">12.17° N · 68.99° W</textPath></text>
      <text x="100" y="82" font-size="8" letter-spacing="3" font-weight="600">TLL</text>
      <text x="100" y="106" font-size="16" font-weight="600" letter-spacing="1">CURAÇAO</text>
      <text x="100" y="124" font-size="9.5" letter-spacing="2">12 OCT 2026</text>
    </g>
  </g>
</svg>
