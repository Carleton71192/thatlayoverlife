<style id="tll-mag-story-v1">
/* The magazine story page, layer v1 (26 Oct 2026). handoff/CREATIVE-DIRECTION-2026-10-26.md, direction A with the stamp.

   of its own (the site head loads Playfair and JetBrains Mono, Webflow loads Plex). Negative tracking capped at -.01em for the heavier face.
