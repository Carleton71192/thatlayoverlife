<style id="tll-font-fallbacks-v1">
/* tll-font-fallbacks-v1 (12 Nov 2026, the font loading jump on phones): fallback faces that take the room the web fonts take.
   Until IBM Plex Sans Condensed and Playfair Display arrive, text is laid out in a fallback font (and painted in it once the block period
   ends). Arial, Georgia and Times are 6 to 20 percent wider than Plex Condensed and Playfair 800, so lines wrapped differently and the page
   jumped when the fonts arrived (about 0.09 to 0.15 layout shift on the home page, most of it the cover headline and promise line).
   These faces are the local Arial, Roboto, Georgia, Noto Serif and Times fonts scaled (size-adjust) to the web fonts' average advance
   over the site's own text, with the web fonts' ascent and descent (overrides), so fallback text wraps and sits as the web text will.
   The build (build-site-layers-v16.py, fallbacks()) puts the names in every layer stack right after the web font:
   TLLSansA,TLLSansR after IBM Plex Sans Condensed and DM Sans (an alias of the Plex files; where DM Sans follows Plex, after DM Sans only,
   so the alias still starts the Plex download at the first layout), TLLSerifG,TLLSerifN,TLLSerifT after Playfair Display. A device that has none of the local fonts skips the names and falls through to the stack as before. Once the web fonts
   are in, nothing here is used: same fonts, weights and sizes. Each face carries the unicode-range of the Google Fonts files it stands in for
   (latin, latin-ext and vietnamese, the same for Plex and Playfair), so a character the web fonts do not have (the arrow U+2192, for one)
   still falls through to the same font as before, loaded or not. Values from the font files (Plex: hhea; Playfair: typo metrics), divided by
   size-adjust. JetBrains Mono needs none (0.600em advance, the same as Courier New, Liberation Mono and DejaVu Sans Mono).
   The :root,body rule gives the same fallbacks to the Webflow Designer font variables (classes such as .tll-nav-link, the desktop nav links,
   read them); each keeps its own first family and the rest of its stack, so the look is unchanged. Webflow sets them on :root and again
   on body below 992px, so the rule names both. If one of these variables is changed in Webflow, change it here too. */
