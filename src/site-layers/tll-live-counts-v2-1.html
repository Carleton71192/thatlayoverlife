<script>

(function(){var A={usa:'us',oregon:'us',uk:'gb',maine:'us','texas hill country':'us',dubai:'ae','sao paulo':'br','ho chi minh city':'vn',copenhagen:'dk',balkans:'dk pl cz sk at hu si rs xk al mk bg','seven continents':'us br aq ie dk vn nz za','hanoi to bangkok':'vn th'},N;
