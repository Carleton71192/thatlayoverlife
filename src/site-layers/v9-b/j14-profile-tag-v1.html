<style id="tll-v9-j14-profile-v1">
/* v9 J14 profile header (6 Oct 2026, DRAFT): the public profile hero becomes the horizontal luggage tag from DESIGN-SPEC-v9 (corners cut on the
   left at 26px, grommet 24px in and vertically centred, dashed stitch at 58px, PROPERTY OF · TLL TRAVELER row). Cream tag on the Ink hero, so the
   text inside flips to Ink and the teal badge to #067A79. CSS plus a 6-line wrapper script (the drop shadow needs a wrapper because clip-path eats
   box-shadow). Nothing removed: avatar, badges, name, meta, home, pronouns, directory block and stats all stay. */
.tll-prof-tagwrap{display:block;filter:drop-shadow(0 14px 26px rgba(10,11,20,.35));transform:rotate(-.6deg);transform-origin:50% 50%;margin:0 0 8px}
[data-tll-prof="hero-grid"]{position:relative;background:#F7F1E8;color:#0A0B14;clip-path:polygon(26px 0,100% 0,100% 100%,26px 100%,0 calc(100% - 26px),0 26px);padding:46px 32px 30px 92px !important;gap:24px !important;align-items:center !important;background-image:repeating-linear-gradient(180deg,#c9b89a 0 6px,transparent 6px 12px);background-size:1px 100%;background-repeat:no-repeat;background-position:58px 0}
[data-tll-prof="hero-grid"]::before{content:"";position:absolute;left:24px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#0A0B14;box-shadow:inset 0 0 0 4px #c9b89a}
[data-tll-prof="hero-grid"]::after{content:"PROPERTY OF \00b7  TLL TRAVELER";position:absolute;left:92px;top:16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:#6B6660;font-weight:600}
[data-tll-prof="avatar-img"]{box-shadow:0 0 0 3px #F0507A !important}
[data-tll-prof="name"]{color:#0A0B14 !important;font-size:clamp(34px,4.4vw,72px) !important;line-height:.95 !important;letter-spacing:-.03em !important}
[data-tll-prof="meta"],[data-tll-prof="home"],[data-tll-prof="pronouns"],[data-tll-prof="dir-lives"]{color:#6B6660 !important}
[data-tll-prof="badges"] > div{background:#067A79 !important;color:#F7F1E8 !important}
[data-tll-prof="badges"] > [data-tll-prof="badge-fun"]{background:transparent !important;color:#0A0B14 !important;border:1px solid #0A0B14 !important}
[data-tll-prof="badges"] > [data-tll-prof="badge-dir"]{background:#C8325B !important;color:#fff !important}
[data-tll-prof="dir-tags-label"]{color:#067A79 !important}
[data-tll-prof="dir-tags"] span{border-color:#0A0B14 !important;color:#0A0B14 !important}
[data-tll-prof="stats"]{margin-top:40px !important}
@media(max-width:700px){[data-tll-prof="hero-grid"]{padding:44px 20px 24px 64px !important;background-position:44px 0;clip-path:polygon(20px 0,100% 0,100% 100%,20px 100%,0 calc(100% - 20px),0 20px)}[data-tll-prof="hero-grid"]::before{left:14px}[data-tll-prof="hero-grid"]::after{left:64px;top:14px}}
@media(prefers-reduced-motion:reduce){.tll-prof-tagwrap{transform:none}}
</style>
<script id="tll-v9-j14-profile-js-v1">
/* Wraps the hero grid once so the drop shadow survives the clip-path. Additive: the grid and every child keep their ids and attributes. */
(function(){function w(){var g=document.querySelector('[data-tll-prof="hero-grid"]');if(!g||g.closest('.tll-prof-tagwrap'))return;var d=document.createElement('div');d.className='tll-prof-tagwrap';g.parentNode.insertBefore(d,g);d.appendChild(g);}
if(document.readyState!=='loading')w();else document.addEventListener('DOMContentLoaded',w);})();
</script>
