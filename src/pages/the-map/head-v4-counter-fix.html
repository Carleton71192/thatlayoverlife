   member editor in the footer. The shared script builds its tooltip with d3 .style('cssText', ...), which
   d3 reads as a CSS property name. No such property exists, so its styles never applied and it rendered
   unstyled at the foot of the page. Both the public view and the member editor already supply their own

<script>
(function(){
  if(window.__tllMsSync) return; window.__tllMsSync=1;
  var KEY="tllStates", AT="tllStatesAt";
  /* 2026-10-07 (B42): the local copy of the map belongs to the member who wrote it. When a different
     member logs in on the same browser, the old copy is dropped so nobody inherits someone else's map. */
  try{var mid=localStorage.getItem("_ms-mid")||"";var own=localStorage.getItem("tllStatesOwner")||"";if(mid&&own&&own!==mid){localStorage.removeItem(KEY);localStorage.removeItem(AT);}if(mid)localStorage.setItem("tllStatesOwner",mid);}catch(e){}
  function loc(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  function locAt(){return +(localStorage.getItem(AT)||0);}
  function setLoc(s,t){try{localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem(AT,String(t));}catch(e){}}
  var last="", tm;
  window.__tllPush=function(s){
    var j; try{j=JSON.stringify(s);}catch(e){return;}
    if(j===last) return;
    try{localStorage.setItem(AT,String(Date.now()));}catch(e){}
    clearTimeout(tm);
    tm=setTimeout(function(){
      var ms=window.$memberstackDom; if(!ms) return;
      ms.getCurrentMember().then(function(r){
        if(!r||!r.data) return;
        return ms.getMemberJSON().then(function(mj){
          var json=(mj&&mj.data)||{};
          json.tllStates=JSON.parse(j); json.tllStatesAt=Date.now();
          return ms.updateMemberJSON({json:json}).then(function(){last=j;});
        });
      }).catch(function(){});
    },1200);
  };
  function pull(){
    var ms=window.$memberstackDom; if(!ms) return false;
    ms.getCurrentMember().then(function(r){
      if(!r||!r.data) return;
      return ms.getMemberJSON().then(function(mj){
        var json=(mj&&mj.data)||{};
        var rs=json.tllStates, ra=+(json.tllStatesAt||0);
        var ls=loc(), la=locAt();
        if(rs&&(!ls||ra>la)){
          last=JSON.stringify(rs);
          setLoc(rs,ra||Date.now());
          if(window.__tllQuickCount) window.__tllQuickCount(); /* 2026-10-07 (B48): the hero counter follows the record as soon as it arrives */
          if(window.__tllMapApply) window.__tllMapApply(rs);
          else{var n2=0,iv2=setInterval(function(){if(window.__tllMapApply){clearInterval(iv2);window.__tllMapApply(JSON.parse(last));}else if(++n2>100){clearInterval(iv2);}},300);}
        } else if(ls&&(la>ra||!rs)){
          window.__tllPush(ls);
        }
      });
    }).catch(function(){});
    return true;
  }
  var n=0, iv=setInterval(function(){ if(pull()||++n>60) clearInterval(iv); },300);
})();
</script>
