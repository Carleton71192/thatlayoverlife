<script>
(function(){

  /* 2026-10-07: the hero counter fills from the saved record at once, and again when Memberstack answers, so it never sits on the dash. */

  function quickCount(){try{var s=JSON.parse(localStorage.getItem("tllStates")||"null");var n=s&&s.v===2&&s.states?tllOwnN(s):0;var c=document.querySelector("#tll-map-counter,.tll-map-counter-num");if(c)c.textContent=/\//.test(c.textContent)?n+" / 249":String(n);var pc=document.querySelector("#tll-map-pct,.tll-map-counter-pct");if(pc)pc.textContent=Math.round(n/249*100)+"%";}catch(e){}}

    var paths=[].slice.call(map.querySelectorAll("path")).filter(function(p){return p.__data__&&p.__data__.properties&&p.__data__.properties.name;});
    var byId={}; paths.forEach(function(p){byId[pad(p.__data__.id)]=p;});

    paths.forEach(function(p){ p.setAttribute("fill",LAND); p.setAttribute("stroke",STROKE); p.setAttribute("stroke-width","0.5"); p.style.cursor="pointer"; });
    var pinLayer=document.createElementNS(SVGNS,"g"); pinLayer.setAttribute("id","tll-pins"); map.appendChild(pinLayer);

    function dot(cx,cy,r,fill,stroke,sw){var el=document.createElementNS(SVGNS,"circle");el.setAttribute("cx",cx);el.setAttribute("cy",cy);el.setAttribute("r",r);el.setAttribute("fill",fill);el.setAttribute("stroke",stroke);el.setAttribute("stroke-width",sw);el.setAttribute("class","tll-pin");return el;}
    function drawPin(id){ var e=data.states[id]; var p=byId[id]; if(pins[id]){pinLayer.removeChild(pins[id]);delete pins[id];} if(!e||!p)return; var ts=data.travelers.filter(function(t){return e[t.id];}); if(!ts.length)return; var c=centroid(p); var g=document.createElementNS(SVGNS,"g"); var many=ts.length>1; ts.forEach(function(t,i){ var cx=c[0]+(i-(ts.length-1)/2)*(many?7:0), cy=c[1], k=e[t.id]; if(k==="lived"){ g.appendChild(dot(cx,cy,many?5.2:6,"none",t.color,"1.2")); } if(k==="layover"){ g.appendChild(dot(cx,cy,many?2.6:3.2,LAND,t.color,"1.6")); } else { g.appendChild(dot(cx,cy,many?3:3.6,t.color,"#fff","1.1")); } }); pinLayer.appendChild(g); pins[id]=g; }
    function redrawAll(){var a={},k;for(k in pins)a[k]=1;for(k in data.states)a[k]=1;Object.keys(a).forEach(function(id){drawPin(id);});}
    function count(){return tllOwnN(data);}
    function updateCount(){var n=count();var c=document.querySelector("#tll-map-counter,.tll-map-counter-num");if(c){c.textContent=/\//.test(c.textContent)?n+" / 249":String(n);}var pc=document.querySelector("#tll-map-pct,.tll-map-counter-pct");if(pc)pc.textContent=Math.round(n/249*100)+"%";var h=document.getElementById("tllEmpty");if(h)h.style.display=n?"none":"block";if(btn)btn.textContent=n?"✎  Log or edit countries":"✎  Log a country";}
    /* 2026-10-07: every save is announced, so the share card below re-renders instead of waiting for a reload. */
    function announce(){try{window.dispatchEvent(new CustomEvent("tll:states",{detail:JSON.parse(JSON.stringify(data))}));}catch(e){}}
    function save(){try{localStorage.setItem("tllStates",JSON.stringify(data));}catch(e){}updateCount();announce();window.__tllPush&&window.__tllPush(data);}
    var lg=document.createElement("div"); lg.id="tllLegend";
    function ic(kind){var s='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">';if(kind==="lived")s+='<circle cx="8" cy="8" r="6.5" fill="none" stroke="#0D0F1A" stroke-width="1.2"/><circle cx="8" cy="8" r="3.4" fill="#0D0F1A"/>';else if(kind==="visited")s+='<circle cx="8" cy="8" r="3.6" fill="#0D0F1A"/>';else s+='<circle cx="8" cy="8" r="3.2" fill="'+LAND+'" stroke="#0D0F1A" stroke-width="1.6"/>';return s+'</svg>';}
    function rebuildLegend(){ lg.innerHTML=""; data.travelers.forEach(function(t){ var s=document.createElement("span"); var i=document.createElement("i"); i.style.background=t.color; s.appendChild(i); s.appendChild(document.createTextNode((t.pet?"🐾 ":"")+t.name)); lg.appendChild(s); }); var s2=document.createElement("span"); var i2=document.createElement("i"); i2.style.background=LAND; i2.style.boxShadow="0 0 0 1px "+STROKE; s2.appendChild(i2); s2.appendChild(document.createTextNode("Not yet")); lg.appendChild(s2); var dep=document.createElement("span"); dep.id="tllDepth"; dep.innerHTML='<span>'+ic("lived")+'Lived</span><span>'+ic("visited")+'Visited</span><span>'+ic("layover")+'Layover</span>'; lg.appendChild(dep); }
    var cv=document.querySelector("#tll-map-canvas");(cv?cv.parentNode:map.parentNode).appendChild(lg);
    /* 2026-10-07 (B43): an empty map says what to do. Hidden once the first country is logged. */
    var hint=document.createElement("p"); hint.id="tllEmpty"; hint.textContent="Your map starts empty. Click a country to log it, or search the list.";
    (cv?cv.parentNode:map.parentNode).appendChild(hint);
    var btn=document.createElement("button"); btn.textContent="✎  Log a country";
    btn.style.cssText="display:block;margin:14px auto 4px;background:#F0507A;color:#fff;border:none;border-radius:999px;padding:12px 24px;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(240,80,122,.35);";
    (cv?cv.parentNode:map.parentNode).appendChild(btn);
    redrawAll(); updateCount(); rebuildLegend();
    var tip=document.createElement("div"); tip.style.cssText="position:fixed;z-index:99999;pointer-events:none;background:#0D0F1A;color:#F7F1E8;font-family:Inter,system-ui,sans-serif;font-size:14px;padding:8px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .12s;white-space:nowrap;"; document.body.appendChild(tip);
    function moveTip(e){tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-8)+"px";}
    paths.forEach(function(p){
      p.addEventListener("mouseenter",function(ev){var d=p.__data__;var id=pad(d.id);var f=flag(d.id);var e=data.states[id];var st="";if(e){st=" · "+data.travelers.filter(function(t){return e[t.id];}).map(function(t){return esc(t.name)+": "+TRIP[e[t.id]];}).join(" · ");}else{st=' <span style="opacity:.65">· Click to log</span>';}tip.innerHTML=(f?f+" ":"")+"<b>"+esc(nameFor(d.id,d.properties.name))+"</b>"+st;tip.style.opacity="1";moveTip(ev);p.setAttribute("stroke","#0D0F1A");p.setAttribute("stroke-width","1");p.parentNode.insertBefore(p,pinLayer);});
      p.addEventListener("mousemove",moveTip);
      p.addEventListener("mouseleave",function(){tip.style.opacity="0";p.setAttribute("stroke",STROKE);p.setAttribute("stroke-width","0.5");});
      /* 2026-10-07 (B43): clicking a country opens the editor on that country. */

    });
    var panel=document.createElement("div");
    panel.style.cssText="position:fixed;top:0;right:0;height:100%;width:400px;max-width:94vw;background:#12141F;color:#F7F1E8;z-index:99998;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(0,0,0,.4);font-family:Inter,system-ui,sans-serif;";
    panel.innerHTML='<div style="padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;"><strong style="font-size:17px;">Where we have been</strong><span id="tllX" style="cursor:pointer;font-size:24px;opacity:.7;">&times;</span></div><div id="tllT" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 20px 2px;"></div><input id="tllQ" placeholder="Search (UK, USA, Holland)..." style="margin:12px 20px 6px;padding:11px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#F7F1E8;font-size:14px;outline:none;"><div id="tllC" style="padding:2px 20px 10px;font-size:11px;color:#00C9C8;letter-spacing:.08em;text-transform:uppercase;"></div><div id="tllL" style="flex:1;overflow:auto;padding:0 10px 12px;"></div><div style="padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.1);"><button id="tllSave" style="width:100%;background:#F0507A;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;">Save</button></div>';
    document.body.appendChild(panel);
    var listEl=panel.querySelector("#tllL");
    function q(){return panel.querySelector("#tllQ").value;}
    var items=paths.map(function(p){var id=pad(p.__data__.id);return {id:id,name:nameFor(p.__data__.id,p.__data__.properties.name),st:stext(p.__data__.id,p.__data__.properties.name),hasPin:true};})
      .concat(EXTRA.filter(function(e){return !byId[e.i];}).map(function(e){return {id:pad(e.i),name:e.n,st:stext(e.i,e.n),hasPin:false};}));
    items.sort(function(a,b){return a.name.localeCompare(b.name);});

    function rebuildTStrip(){

    }
    function render(f){f=(f||"").toLowerCase();listEl.innerHTML="";items.forEach(function(it){if(f&&it.st.indexOf(f)<0)return;listEl.appendChild(row(it));});}
    function openPanel(f){rebuildTStrip();var qi=panel.querySelector("#tllQ");qi.value=f||"";render(qi.value);pcount();listEl.scrollTop=0;panel.style.transform="translateX(0)";}
    window.__tllMapApply=function(ns){data=migrate(ns);redrawAll();rebuildLegend();rebuildTStrip();updateCount();announce();if(panel.style.transform==="translateX(0px)"){render(q());pcount();}};
    panel.querySelector("#tllQ").addEventListener("input",function(e){render(e.target.value);});
    panel.querySelector("#tllX").addEventListener("click",function(){panel.style.transform="translateX(100%)";});
    var sb=panel.querySelector("#tllSave");
    sb.addEventListener("click",function(){save();var o=sb.textContent;sb.textContent="✓ Saved";sb.style.background="#00A39E";setTimeout(function(){sb.textContent=o;sb.style.background="#F0507A";panel.style.transform="translateX(100%)";},650);});
    btn.addEventListener("click",function(){openPanel("");});
    /* 2026-10-08 (B47): /the-map#edit opens the editor straight away, for the Edit my destinations links on the profile and account pages. */
    function hashOpen(){if(/^#(edit|log)$/i.test(location.hash)){openPanel("");}}
    hashOpen(); window.addEventListener("hashchange",hashOpen);
  });
})();
</script>
