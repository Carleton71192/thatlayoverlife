<script id="tll-prof-v2-js">
/* TLL public profile v2 (2026-09-29, screen 11). Link rows come from the CMS; the href is copied from the bound URL line so no row ever points at "#".
   Stories are read from the live /stories shelf by byline name, never typed. Counts on this page are counted, not written. */
(function(){
function q(s,r){return [].slice.call((r||document).querySelectorAll(s));}
function first(n){return (n||'').trim().split(/\s+/)[0]||'';}
function run(){
var nameEl=document.querySelector('[data-tll-prof="name"]');var name=nameEl?nameEl.textContent.trim():'';var fn=first(name);
q('[data-tll-prof="badges"] > *').forEach(function(b){if(!b.textContent.trim())b.style.display='none';});
q('[data-tll-prof="meta"],[data-tll-prof="home"],[data-tll-prof="pronouns"]').forEach(function(e){if(!e.textContent.trim())e.style.display='none';});
var since=document.querySelector('[data-tll-prof="n-since"]');if(since){var d=new Date(since.textContent.trim());if(!isNaN(d.getTime()))since.textContent=String(d.getFullYear());else if(!since.textContent.trim())since.closest('[data-tll-prof="stat"]').style.display='none';}
q('[data-tll-prof="n-countries"],[data-tll-prof="n-continents"]').forEach(function(e){if(!e.textContent.trim())e.closest('[data-tll-prof="stat"]').style.display='none';});
q('[data-tll-prof="voice-card"]').forEach(function(c){var t=c.querySelector('[data-tll-prof="trust"],[data-tll-prof="opinion"]');if(!t||!t.textContent.trim())c.style.display='none';});
if(!q('[data-tll-prof="voice-card"]').some(function(c){return c.style.display!=='none';})){var vs=document.querySelector('[data-tll-prof="voice"]');if(vs)vs.style.display='none';}
var lt=document.querySelector('[data-tll-prof="links-title"]');if(lt&&fn)lt.textContent='Find '+fn+' elsewhere';
var live=0;q('[data-tll-link]').forEach(function(a){var u=a.querySelector('[data-tll-prof="link-url"]');var href=u?u.textContent.trim():'';if(!/^https?:\/\//i.test(href)){a.style.display='none';return;}a.setAttribute('href',href);u.textContent=href.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,'');live++;});
var le=document.querySelector('[data-tll-prof="links-empty"]');if(le)le.style.display=live?'none':'';
var ft=document.querySelector('[data-tll-prof="filed-title"]');if(ft&&fn)ft.textContent='Stories by '+fn;
var list=document.querySelector('[data-tll-prof="filed-list"]'),fe=document.querySelector('[data-tll-prof="filed-empty"]'),ns=document.querySelector('[data-tll-prof="n-stories"]');
if(!list||!name)return;
fetch('/stories').then(function(r){return r.text();}).then(function(h){
var doc=new DOMParser().parseFromString(h,'text/html');var cards=q('a.tll-lib-card,[data-tll-card]',doc).filter(function(c){var img=c.querySelector('.tll-lib-byline-img');var by=(img&&img.getAttribute('alt'))||'';var txt=c.textContent||'';return by.trim().toLowerCase()===name.toLowerCase()||txt.toLowerCase().indexOf(name.toLowerCase())>-1;});
var seen={};cards=cards.filter(function(c){var h=c.getAttribute('href')||c.id;if(!h||seen[h])return false;seen[h]=1;return true;});
if(ns)ns.textContent=String(cards.length);
if(!cards.length){if(fe)fe.style.display='';return;}
if(fe)fe.style.display='none';
cards.slice(0,6).forEach(function(c){var href=c.getAttribute('href')||('/stories/'+c.id);if(href&&!/^\/stories\//.test(href)&&c.id)href='/stories/'+c.id;var title=(c.querySelector('h3,h2,.tll-lib-title')||{}).textContent||'';var meta=(c.querySelector('.tll-lib-meta')||{}).textContent||'';
var a=document.createElement('a');a.href=href;a.className='tll-prof-story';a.innerHTML='<span class="tll-prof-story-meta"></span><span class="tll-prof-story-title"></span>';a.querySelector('.tll-prof-story-meta').textContent=meta.trim().replace(/\s+/g,' ');a.querySelector('.tll-prof-story-title').textContent=title.trim();list.appendChild(a);});
}).catch(function(){if(fe)fe.style.display='';});
}
if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
})();
</script>
<script id="tll-prof-dir-js-v1">
/* Directory layer on the public profile (board D2, 30 Sep 2026). Finds this member's Directory item by profile slug. Renders only switched-on links (rel noopener nofollow ugc, new tab). Contact goes to Instagram, a WhatsApp Business short link or the relay; never a number or an email. */
(function(){
  var slug=(location.pathname.match(/\/contributors\/([^\/?#]+)/)||[])[1]||''; if(!slug) return; slug=decodeURIComponent(slug).toLowerCase();
  var node=[].slice.call(document.querySelectorAll('[data-tll-dir]')).filter(function(n){return (n.dataset.slug||'').toLowerCase()===slug;})[0]; if(!node) return;
  var d=node.dataset, esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var flags=(d.flags||'').split(/\s+/), links=[]; try{links=JSON.parse(d.links||'[]')}catch(e){}
  var name=(document.querySelector('[data-tll-prof="name"]')||{}).textContent||d.name||''; name=name.trim();
  var badges=document.querySelector('[data-tll-prof="badges"]');
  if(badges){['expat','creator','press'].forEach(function(k){if(flags.indexOf(k)>-1){var b=document.createElement('div');b.setAttribute('data-tll-prof','badge-dir');b.textContent=k==='press'&&flags.indexOf('verified')>-1?'Verified press':k;badges.appendChild(b);}});}
  var hero=document.querySelector('[data-tll-prof="dir-hero"]');
  if(hero&&flags.indexOf('expat')>-1&&d.lives){
    var lv=hero.querySelector('[data-tll-prof="dir-lives"]'); if(lv) lv.textContent='Lives in '+d.lives+(d.since?' since '+d.since:'')+(d.knows?' · Knows '+d.knows:'');
    var tags=(d.tags||'').split(',').map(function(t){return t.trim()}).filter(Boolean);
    var tw=hero.querySelector('[data-tll-prof="dir-tags"]'), tl=hero.querySelector('[data-tll-prof="dir-tags-label"]');
    if(tw) tw.innerHTML=tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('');
    if(tl) tl.style.display=tags.length?'':'none';
    hero.removeAttribute('hidden');
  }
  var LABEL={website:'Blog or website',newsletter:'Newsletter',instagram:'Instagram',tiktok:'TikTok',youtube:'YouTube',strava:'Strava',other:'Everything else'};
  var box=document.querySelector('[data-tll-prof="dir-links"]');
  if(box&&links.length){
    var hrefs={};
    box.innerHTML=links.filter(function(l){return /^https?:\/\//i.test(l.url||'')}).map(function(l){hrefs[l.url.replace(/\/$/,'').toLowerCase()]=1;return '<a class="tll-link-row" data-tll-link="dir-'+esc(l.type)+'" href="'+esc(l.url)+'" target="_blank" rel="noopener nofollow ugc"><span data-tll-prof="link-platform">'+esc(LABEL[l.type]||l.type)+'</span><span data-tll-prof="link-url">'+esc(l.url.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''))+'</span></a>'}).join('');
    if(box.children.length){ box.removeAttribute('hidden'); var le=document.querySelector('[data-tll-prof="links-empty"]'); if(le) le.style.display='none';
      [].forEach.call(document.querySelectorAll('[data-tll-prof="links-list"] [data-tll-link]'),function(a){var h=(a.getAttribute('href')||'').replace(/\/$/,'').toLowerCase(); if(hrefs[h]) a.style.display='none';}); }
  }
  var cb=document.querySelector('[data-tll-prof="dir-contact"]');
  if(cb){
    var cm=(d.cmode||'').toLowerCase(), href='';
    if(cm!=='none'){ if(d.ig) href='https://www.instagram.com/'+encodeURIComponent(d.ig.replace(/^@/,'')); else if(d.wa&&/^https:\/\/wa\.me\/message\//i.test(d.wa)) href=d.wa; else if(flags.indexOf('relay')>-1) href='/contact?relay='+encodeURIComponent(slug); }
    var btn=cb.querySelector('[data-tll-prof="dir-contact-btn"]'), note=cb.querySelector('[data-tll-prof="dir-contact-note"]');
    if(btn){ if(href){ btn.setAttribute('href',href); if(/^https?:/.test(href)){btn.setAttribute('target','_blank');btn.setAttribute('rel','noopener nofollow ugc');} } else { btn.setAttribute('hidden',''); if(note) note.textContent='Not accepting contact right now.'; } }
    var rep=cb.querySelector('[data-tll-prof="dir-report"]'); if(rep) rep.setAttribute('href','mailto:hello@thatlayover.life?subject='+encodeURIComponent('REPORT · '+name+' · /contributors/'+slug));
    cb.removeAttribute('hidden');
  }
})();
</script>
<!-- tll-pf3-profile-js-v1 (Profile 3.0, 11 Oct 2026): script, last in the template footer. Rows P3, P4, P5, P8, P10. -->
<script id="tll-pf3-profile-js-v1">
/* TLL public traveler profile 3.0 (pf3, 11 Oct 2026). Rows P3, P4, P5, P10 and the sameAs line from the approved proposal.
   Reads only: the bound Member ID on [data-pf3="owner"], the viewer's own Memberstack id and tllStates (never written here),
   the Directory item already on the page, and the /stories shelf. Nothing is typed: every count is counted.
   P5: the old footer binder is switched off by the header page script tllpf3guardv1 (window.__tllProfStats=1). As a fallback
   this script locks the three counted stats so no other writer (binder, sitewide story counter) can change them afterwards. */
(function(){
  if(window.__pf3Prof) return; window.__pf3Prof=1;
  var D=document;
  function q(s,r){return [].slice.call((r||D).querySelectorAll(s));}
  function one(s,r){return (r||D).querySelector(s);}
  function txt(e){return e?(e.textContent||'').trim():'';}
  function lock(el,val){if(!el)return;el.__pf3v=String(val);if(el.textContent!==el.__pf3v)el.textContent=el.__pf3v;
    if(!el.__pf3o&&window.MutationObserver){el.__pf3o=new MutationObserver(function(){if(el.__pf3v!=null&&el.textContent!==el.__pf3v)el.textContent=el.__pf3v;});el.__pf3o.observe(el,{childList:true,characterData:true,subtree:true});}}
  function stat(el){return el?el.closest('[data-tll-prof="stat"]'):null;}

  /* P5. Stats. Visitors see the bound Country count and Continents marathoned; nothing else may overwrite them. */
  var nC=one('[data-tll-prof="n-countries"]'),nK=one('[data-tll-prof="n-continents"]'),nS=one('[data-tll-prof="n-stories"]');
  if(nC&&/^\d+$/.test(txt(nC)))lock(nC,txt(nC));
  if(nK&&/^\d+$/.test(txt(nK)))lock(nK,txt(nK));
  var sS=stat(nS);if(sS)sS.classList.add('pf3-pending');
  function storiesDone(n){if(!nS||!sS)return;sS.classList.remove('pf3-pending');if(n==null){sS.style.display='none';return;}lock(nS,n);}
  setTimeout(function(){if(sS&&sS.classList.contains('pf3-pending'))storiesDone(null);},10000);

  /* Countries: Lived + Stayed for the member's own (non-pet) travelers, layovers apart. 19 Oct 2026: Antarctica (010) is not a
     country, so it is left out of this number and shown as "+ Antarctica" under it when ticked. */
  function ownN(d){var hum={},any=0;(d&&d.travelers||[]).forEach(function(t){if(t&&!t.pet){hum[t.id]=1;any=1;}});var n=0;
    Object.keys(d&&d.states||{}).forEach(function(k){if(k==='010')return;var row=d.states[k]||{},ok=false;Object.keys(row).forEach(function(id){if(any&&!hum[id])return;var v=row[id];if(v==='lived'||v==='visited')ok=true;});if(ok)n++;});return n;}
  function ataOn(d){var hum={},any=0;(d&&d.travelers||[]).forEach(function(t){if(t&&!t.pet){hum[t.id]=1;any=1;}});var row=(d&&d.states||{})['010']||{};
    return Object.keys(row).some(function(id){if(any&&!hum[id])return false;var v=row[id];return v==='lived'||v==='visited';});}
  function ataMark(s,on){var x=s.querySelector('.pf3-ata');if(on&&!x){x=D.createElement('span');x.className='pf3-ata';x.textContent='+ Antarctica';
    x.style.cssText="display:block;margin-top:4px;font:600 11px/1.3 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;color:inherit";s.appendChild(x);}else if(!on&&x)x.parentNode.removeChild(x);}
  var ownerId=((one('[data-pf3="owner"]')||{getAttribute:function(){return '';}}).getAttribute('data-member')||'').trim();
  function showOwn(st){if(!nC||!st||st.v!==2||!st.states)return;lock(nC,ownN(st));var s=stat(nC);if(s){s.setAttribute('data-pf3-own','');s.style.display='';ataMark(s,ataOn(st));}}
  if(ownerId&&nC){var tries=0,iv=setInterval(function(){var ms=window.$memberstackDom;if(!ms){if(++tries>40)clearInterval(iv);return;}clearInterval(iv);
    ms.getCurrentMember().then(function(r){var id=r&&r.data&&r.data.id;if(!id||id!==ownerId)return;
      var ls=null;try{if(localStorage.getItem('tllStatesOwner')===id)ls=JSON.parse(localStorage.getItem('tllStates')||'null');}catch(e){}
      if(ls&&ls.v===2)showOwn(ls);
      return ms.getMemberJSON().then(function(mj){var st=mj&&mj.data&&mj.data.tllStates;if(st&&st.v===2)showOwn(st);});
    }).catch(function(){});},250);}

  function ready(fn){if(D.readyState!=='loading')fn();else D.addEventListener('DOMContentLoaded',fn);}
  ready(function(){
    var slug=decodeURIComponent((location.pathname.match(/\/contributors\/([^\/?#]+)/)||[])[1]||'').toLowerCase();
    var heroId=one('[data-tll-prof="hero-id"]');

    /* P3. Hide Traveler Category when it says the same as Badge ("Founder" twice). */
    var role=one('[data-tll-prof="badge-role"]'),cat=one('[data-tll-prof="badge-cat"]');
    function norm(s){return s.toLowerCase().replace(/^the\s+/,'').trim();}
    if(role&&cat&&txt(cat)&&norm(txt(role))===norm(txt(cat)))cat.classList.add('pf3-dupe');

    /* P4. Languages from the Directory item (bound element), shown only when the member has the expat directory on.
       Speaks and pronouns are moved (not copied) behind Lives in so the mono line reads in order. */
    var dir=q('[data-tll-dir]').filter(function(n){return (n.getAttribute('data-slug')||'').toLowerCase()===slug;})[0];
    var expat=dir&&((dir.getAttribute('data-flags')||'').split(/\s+/).indexOf('expat')>-1);
    var lang=q('[data-tll-prof="dir-src"] [data-pf3="langs"]').filter(function(n){return (n.getAttribute('data-slug')||'').toLowerCase()===slug;})[0];
    var dh=one('[data-tll-prof="dir-hero"]'),lives=dh&&!dh.hasAttribute('hidden')?one('[data-tll-prof="dir-lives"]',dh):null,pro=one('[data-tll-prof="pronouns"]');
    if(heroId&&lang&&expat&&txt(lang)){if(lives)lives.parentNode.insertBefore(lang,lives.nextSibling);else heroId.appendChild(lang);}else lang=null;
    if(pro&&lives)lives.parentNode.insertBefore(pro,(lang||lives).nextSibling);
    var parts=[one('[data-tll-prof="home"]'),lives,lang,pro];
    var first=true;parts.forEach(function(e){if(!e)return;if(!txt(e)||e.style.display==='none'){e.classList.remove('pf3-sep');return;}if(first){first=false;e.classList.remove('pf3-sep');}else e.classList.add('pf3-sep');});

    /* P8. tll-prof-v2-js hides every [data-tll-link] row whose URL line is not a full URL, which includes the switched-on
       Directory rows tll-prof-dir-js-v1 just rendered (their URL line is shortened). Show those rows again; their href is a
       checked http(s) URL from the member's own Directory item, and the empty state goes when one is visible. */
    var dl=one('[data-tll-prof="dir-links"]');
    if(dl&&!dl.hasAttribute('hidden')){var shown=0;q('[data-tll-link]',dl).forEach(function(a){if(/^https?:\/\//i.test(a.getAttribute('href')||'')){a.style.display='';shown++;}});
      if(shown){var le=one('[data-tll-prof="links-empty"]');if(le)le.style.display='none';}}

    /* sameAs for the Person (…#person): only links that exist on the page, never typed. */
    var hrefs=[];q('[data-tll-link]').forEach(function(a){if(a.style.display==='none')return;var h=a.getAttribute('href')||'';if(/^https?:\/\//i.test(h)&&!/thatlayover\.life/i.test(h)&&hrefs.indexOf(h)<0)hrefs.push(h);});
    var can=one('link[rel="canonical"]');
    if(hrefs.length&&can&&can.href){var s=D.createElement('script');s.type='application/ld+json';s.id='tll-pf3-sameas';s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Person','@id':can.href.split('#')[0]+'#person','sameAs':hrefs});D.head.appendChild(s);}

    /* P5 stories count and P10 photos: the same /stories shelf tll-prof-v2-js reads, same byline match. */
    var name=txt(one('[data-tll-prof="name"]'));
    if(!name||!window.fetch||!window.DOMParser){storiesDone(null);return;}
    fetch('/stories',{credentials:'same-origin'}).then(function(r){return r.text();}).then(function(h){
      var doc=new DOMParser().parseFromString(h,'text/html'),lc=name.toLowerCase();
      var cards=q('a.tll-lib-card,[data-tll-card]',doc).filter(function(c){var img=c.querySelector('.tll-lib-byline-img');var by=(img&&img.getAttribute('alt'))||'';return by.trim().toLowerCase()===lc||(c.textContent||'').toLowerCase().indexOf(lc)>-1;});
      var seen={};cards=cards.filter(function(c){var k=c.getAttribute('href')||c.id;if(!k||seen[k])return false;seen[k]=1;return true;});
      storiesDone(cards.length);
      var pics={};cards.forEach(function(c){var href=c.getAttribute('href')||('/stories/'+c.id);if(href&&!/^\/stories\//.test(href)&&c.id)href='/stories/'+c.id;
        var im=c.querySelector('img.tll-lib-img,.tll-lib-img img,img:not(.tll-lib-byline-img)'),src=im?(im.getAttribute('src')||''):'';
        if(!src){var bg=c.querySelector('.tll-lib-img');var m=bg&&(bg.getAttribute('style')||'').match(/url\(["']?([^"')]+)/);if(m)src=m[1];}
        if(src)pics[href.replace(/\/$/,'')]=src;});
      function deco(){q('[data-tll-prof="filed-list"] .tll-prof-story').forEach(function(a){if(a.__pf3)return;a.__pf3=1;
        var body=D.createElement('span');body.className='pf3-story-body';q('.tll-prof-story-meta,.tll-prof-story-title',a).forEach(function(x){body.appendChild(x);});a.appendChild(body);
        var src=pics[(a.getAttribute('href')||'').replace(/^https?:\/\/[^\/]+/i,'').replace(/\/$/,'')];
        if(src){var i=D.createElement('img');i.className='pf3-story-img';i.src=src;i.alt='';i.width=210;i.height=164;i.loading='lazy';i.decoding='async';a.insertBefore(i,a.firstChild);}});}
      deco();var fl=one('[data-tll-prof="filed-list"]');
      if(fl&&window.MutationObserver){var mo=new MutationObserver(deco);mo.observe(fl,{childList:true});setTimeout(function(){mo.disconnect();},15000);}
    }).catch(function(){storiesDone(null);});

    /* Owner view stays current if the map is edited in another tab. */
    window.addEventListener('storage',function(e){if(e.key!=='tllStates'||!ownerId||!nC||!stat(nC)||!stat(nC).hasAttribute('data-pf3-own'))return;try{showOwn(JSON.parse(e.newValue||'null'));}catch(x){}});
  });
})();
</script>
<style id="tll-pf4-thin-v1">
/* 19 Oct 2026 (Profiles handoff P3, P4): a thin profile shows no empty boxes. The dashed "no links yet" and "no stories yet" boxes hide for visitors;
   the owner keeps the stories box (it carries the write prompt). The photo stays a centered square. */
[data-tll-prof="links-empty"]{display:none !important}
[data-tll-prof="filed-empty"]:not([data-pf4-owner]){display:none !important}
[data-tll-prof="avatar-img"]{object-fit:cover;object-position:center}
</style>
<script id="tll-pf4-thin-js-v1">
/* Hides a links section with no visible rows, a stat whose number is 0, and marks the stories box for the owner so it stays. */
(function(){function run(){var D=document,q=function(s){return [].slice.call(D.querySelectorAll(s));};
  var rows=q('[data-tll-prof="links-list"] [data-tll-link],[data-tll-prof="dir-links"] [data-tll-link]').filter(function(a){return a.style.display!=='none';});
  if(!rows.length){var ll=D.querySelector('[data-tll-prof="links-list"]');if(ll)ll.style.display='none';var lt=D.querySelector('[data-tll-prof="links-title"]');if(lt)lt.style.display='none';}
  q('[data-tll-prof="stat"]').forEach(function(st){var n=st.firstElementChild;if(n&&/^0$/.test((n.textContent||'').trim()))st.style.display='none';});
  var fe=D.querySelector('[data-tll-prof="filed-empty"]'),own=D.querySelector('[data-pf3="owner"]');
  if(fe&&own){var id=(own.getAttribute('data-member')||'').trim(),k=0,iv=setInterval(function(){var ms=window.$memberstackDom;if(!ms){if(++k>40)clearInterval(iv);return;}clearInterval(iv);ms.getCurrentMember().then(function(r){if(r&&r.data&&r.data.id===id)fe.setAttribute('data-pf4-owner','');}).catch(function(){});},250);}
}
if(document.readyState!=='loading')setTimeout(run,1500);else document.addEventListener('DOMContentLoaded',function(){setTimeout(run,1500);});})();
</script>
