<script id="h3-mag-js">
/* Magnus's country count, read from his pet page (the same source tllfactsv1 uses), so it is never typed. */
(function(){var el=document.querySelector('[data-h3-mag]');if(!el)return;fetch('/pets/magnus-waffles',{cache:'no-cache'}).then(function(r){return r.text();}).then(function(h){
var m=h.match(/window\.TLL_PET=\{countries:"([^"]*)"/);if(!m)return;var n=m[1].split(',').filter(function(x){return x.trim();}).length;if(n)el.textContent=String(n);}).catch(function(){});})();
</script>
