<script id="tll-st3-story-js-v1">
/* TLL story page 3.0 helpers v1 (10 Oct 2026). Reads only bound CMS output already on the page; types no story copy.
   - Author row and contributor card: link to /contributors/{slug}, "FILED FROM {location} · {Month Year}" from Published date.
   - Filed-from location (12 Oct 2026): the story's Byline location, else its Country name, else the contributor's own location.
   - Country breadcrumb (12 Oct 2026): links to /destinations/{country slug} when the story has a Country.
   - Sponsored box: approved copy with the host name from Disclosure ("Hosted: {name}"), only when the box is shown.
   - Affiliate aside: unhides only when tll-label-js-v1 (or the v1 shout-out label) marked an affiliate link.
   - Traveled with: initials, /contributors/ and /pets/ links, pet emoji after the name, hides when both lists are empty.
   - Pull quote: skips the CSS curly quotes when the text already carries its own. */
(function(){
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function q(s,r){return (r||document).querySelector(s);}function qa(s,r){return [].slice.call((r||document).querySelectorAll(s));}
function val(n){return n&&!n.classList.contains('w-dyn-bind-empty')?n.textContent.trim():'';}
function okSlug(s){return /^[a-z0-9-]+$/.test(s||'');}
function links(){qa('a[data-st3-slug]').forEach(function(a){var s=a.getAttribute('data-st3-slug');if(okSlug(s))a.href=(a.getAttribute('data-st3-base')||'/contributors/')+s;});}
function author(){var A=q('[data-st3-author]');if(!A||A.dataset.st3Done)return;A.dataset.st3Done='1';
var w=q('[data-st3-when]',A),t=val(w);if(!t)return;
var mo=t.match(/(January|February|March|April|May|June|July|August|September|October|November|December)/i),y=t.match(/\b(19|20)\d{2}\b/);
if(mo&&y){w.textContent=mo[1].charAt(0).toUpperCase()+mo[1].slice(1).toLowerCase()+' '+y[0];return;}
var d=new Date(t);if(!isNaN(d.getTime()))w.textContent=MON[d.getMonth()]+' '+d.getFullYear();else{w.textContent='';w.classList.add('w-dyn-bind-empty');}}
function tc(s){return /[a-z]/.test(s)?s:s.toLowerCase().replace(/(^|[\s,(\/-])(\S)/g,function(m,a,b){return a+b.toUpperCase();});}
function place(){var L=q('[data-st3-loc]');if(!L||L.dataset.st3Place)return;L.dataset.st3Place='1';
var by=(L.getAttribute('data-st3-byline')||'').trim(),cn=(L.getAttribute('data-st3-country-name')||'').trim(),cs=(L.getAttribute('data-st3-country')||'').trim();
var where=by?tc(by):cn;if(where){L.textContent=where;L.classList.remove('w-dyn-bind-empty');}
var C=q('[data-tll-crumb="country"]');if(C&&okSlug(cs)&&C.tagName!=='A'){var a=document.createElement('a');a.href='/countries/'+cs;a.className=C.className;
[].slice.call(C.attributes).forEach(function(x){if(x.name!=='class')a.setAttribute(x.name,x.value);});a.textContent=C.textContent.trim()||cn;C.parentNode.replaceChild(a,C);}}
function sponsored(){var S=q('[data-tll-sponsored]');if(!S||S.dataset.st3Done)return;
var m=val(q('[data-tll-lg="disclosure"]')).match(/^hosted\s*(?:by|:)?\s*(.+)$/i);if(!m)return;
var host=m[1].trim().replace(/[.\s]+$/,''),t=q('[data-tll-sponsored-text]',S);if(!host||!t)return;S.dataset.st3Done='1';
var bd=q('.tll-sponsored-badge',S);if(bd)bd.textContent='Sponsored'; /* 20 Oct 2026: the default badge and sentence are empty in the HTML, so only hosted stories carry a disclosure */
t.textContent='';t.appendChild(document.createTextNode('This story is sponsored by '));var b=document.createElement('strong');b.textContent=host;t.appendChild(b);
t.appendChild(document.createTextNode('. The travel was hosted; the opinions were not. Disclosed at the top, never buried. That is the charter.'));}
function aff(){var A=q('[data-st3-aff]');if(!A||!A.hasAttribute('hidden'))return;
if(qa('.tll-story-body a[data-tll-labeled],[data-tll-links-card] .tll-chip:not(.tll-chip-c)').length)A.removeAttribute('hidden');}
function cotravel(){var T=q('[data-tll-cotravel]');if(!T||T.dataset.st3Done)return;T.dataset.st3Done='1';
var items=qa('.w-dyn-item',T);
items.forEach(function(it){var n=q('.st3-tw-name',it),i=q('.st3-tw-ini',it),e=q('[data-st3-emoji]',it),name=val(n);
if(e){var em=val(e);if(!em||name.indexOf(em)>-1)e.parentNode.removeChild(e);}
if(i&&name)i.textContent=Array.from(name)[0].toUpperCase();});
if(!items.length)T.style.display='none';}
function quote(){var p=q('.tll-story-body > .tll-story-pullquote');if(p&&/^\s*["“„'‘«]/.test(p.textContent))p.setAttribute('data-st3-quoted','1');}

/* 20 Oct 2026 (approved copy, counts and R1 log, E4): sources stored as paragraphs render as paragraphs (text, links, emphasis only);
   dates read "9 October 2026"; read time reads "7 min". */
var MD=/^(January|February|March|April|May|June|July|August|September|October|November|December) (\d{1,2}), (\d{4})$/;
function dates(){qa('.tll-story-meta-row > *,[data-tll-lg="published"],[data-tll-lg="updated"]').forEach(function(e){if(e.children.length)return;var m=(e.textContent||'').trim().match(MD);if(m)e.textContent=m[2]+' '+m[1]+' '+m[3];});}
function mins(){qa('.tll-story-reading-time').forEach(function(e){var t=(e.textContent||'').trim();if(/^\d+$/.test(t))e.textContent=t+' min';});}
function sources(){var S=q('[data-tll-lg="sources"]');if(!S||S.dataset.st3Src)return;var raw=S.textContent||'';if(!/<\s*(p|a|em|strong|br|ul|ol|li)\b/i.test(raw))return;S.dataset.st3Src='1';
var doc=new DOMParser().parseFromString('<div>'+raw+'</div>','text/html'),OK={P:1,A:1,EM:1,STRONG:1,BR:1,UL:1,OL:1,LI:1,I:1,B:1};
function copy(n){if(n.nodeType===3)return document.createTextNode(n.nodeValue);if(n.nodeType!==1)return null;var tag=n.tagName,out;
if(!OK[tag]){out=document.createDocumentFragment();}else if(tag==='A'){var h=n.getAttribute('href')||'';if(!/^https?:\/\//i.test(h)){out=document.createDocumentFragment();}else{out=document.createElement('a');out.href=h;out.target='_blank';out.rel='noopener';}}else out=document.createElement(tag.toLowerCase());
[].forEach.call(n.childNodes,function(c){var k=copy(c);if(k)out.appendChild(k);});return out;}
var frag=document.createDocumentFragment();[].forEach.call(doc.body.firstChild.childNodes,function(c){var k=copy(c);if(k)frag.appendChild(k);});
S.textContent='';S.appendChild(frag);S.classList.add('st3-src-rich');}
function run(){links();author();place();sponsored();cotravel();quote();dates();mins();sources();setTimeout(aff,60);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
window.addEventListener('load',function(){sponsored();aff();});
})();
</script>
<style id="tll-inline-photo-fix">
/* 12 Oct 2026: Webflow's default .w-richtext figure{max-width:60%} was shrinking inline story photos to 60% of the column. */
.tll-story-body .w-richtext figure.tll-inline-photo{max-width:none !important;width:auto !important}
</style>
<style id="tll-st3-r1-v1">
/* 20 Oct 2026 (approved copy, counts and R1 log): receipt rows show only with content; the place shows once (breadcrumb, not the meta row);
   no dangling arrow after the hidden title crumb; "Other stops" hides when it has no stories; the author card prints no typed count. */
[data-tll-ledger] .tll-ledger-row:has(> [data-tll-lg="edited-by"].w-dyn-bind-empty),
[data-tll-ledger] .tll-ledger-row:has(> [data-tll-lg="cost-summary"].w-dyn-bind-empty),
[data-tll-ledger] .tll-ledger-row:has(> [data-tll-lg="sources"].w-dyn-bind-empty),
[data-tll-ledger] .tll-ledger-row:has(> [data-tll-lg="disclosure"].w-dyn-bind-empty){display:none !important}
[data-tll-breadcrumb] span:has(+ [data-tll-crumb="title"]){display:none !important}
.tll-story-meta-row > .tll-story-byline-loc:first-child,.tll-story-meta-row > .tll-story-byline-loc:first-child + .tll-story-meta-divider{display:none !important}
div:has(> .tll-related-header):not(:has(.w-dyn-item)){display:none !important}
.st3-cc-count{display:none !important}
.st3-src-rich p{margin:0 0 8px}.st3-src-rich p:last-child{margin-bottom:0}.st3-src-rich a{color:#067A79;text-decoration:underline;text-underline-offset:2px}
</style>
