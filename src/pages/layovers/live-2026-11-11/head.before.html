<style id="tll-hub-v1">
:root{--ct3-ink:#0A0B14;--ct3-cream:#F7F1E8;--ct3-paper:#FDF9F3;--ct3-line:#E0DACE;--ct3-muted:#6B6660;--ct3-teal-l:#00C9C8;--ct3-rose-t:#C8325B;--ct3-head:'Playfair Display',Georgia,serif;--ct3-body:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;--ct3-mono:'JetBrains Mono',ui-monospace,monospace}
.tllcx-hero{position:relative;display:flex;align-items:flex-end;min-height:300px;padding:72px 24px 32px;background:var(--ct3-ink);color:var(--ct3-cream);box-sizing:border-box}
.tllcx-hero>.tllcx-wrap{width:100%;max-width:1000px;margin:0 auto}
.tllcx-hero .tll-eyebrow-teal{font-family:var(--ct3-mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ct3-teal-l);margin:0 0 12px}
.tllcx-hero h1{font-family:var(--ct3-head);font-weight:800;font-size:clamp(34px,4.2vw,64px);line-height:1.04;color:var(--ct3-cream);margin:0 0 10px;text-wrap:balance}
.tllcx-hero .tllcx-verdict{font-family:var(--ct3-body);font-size:17px;line-height:1.5;color:var(--ct3-cream);max-width:680px;margin:0}
.tllcx-body{background:var(--ct3-paper);padding:40px 24px 72px}.tllcx-body>.tllcx-wrap{max-width:1000px;margin:0 auto}
.tllcx-filed-eyebrow{font-family:var(--ct3-head);font-weight:800;font-size:clamp(24px,2.6vw,30px);line-height:1.15;letter-spacing:0;text-transform:none;color:var(--ct3-ink);margin:0 0 16px}
[data-tll-hub] .w-dyn-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:stretch}
[data-tll-hub] .w-dyn-item{display:flex}
[data-tll-hub] .tllcf-card{overflow:hidden;border-radius:4px;border-color:var(--ct3-line)}
.tllcf-kicker{font-family:var(--ct3-mono)}.tllcf-title{font-family:var(--ct3-head);font-weight:800}.tllcf-dek,.tllcf-more{font-family:var(--ct3-body)}.tllcf-more{margin-top:auto;padding-top:14px}
.tllhub-empty{border:1px dashed var(--ct3-line);border-radius:4px;padding:24px;background:#fff;font-family:var(--ct3-body);color:var(--ct3-muted)}.tllhub-empty p{margin:0 0 8px}.tllhub-empty a{color:var(--ct3-rose-t);font-weight:600}
.tllcx-filed-open{font-family:var(--ct3-body);font-size:14px;color:var(--ct3-muted);margin-top:16px}.tllcx-filed-openlink{color:var(--ct3-rose-t);font-weight:600;text-decoration:none;display:inline-block;padding:12px 0}
@media(max-width:600px){.tllcx-hero{min-height:220px;padding:56px 16px 24px}.tllcx-body{padding:32px 16px 56px}[data-tll-hub] .w-dyn-items{grid-template-columns:1fr}}
</style>
