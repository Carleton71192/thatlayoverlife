
<!-- tll-pf3-profile-v1 (Profile 3.0, 11 Oct 2026): style, last in the template head. Rows P1 to P13. -->
<style id="tll-pf3-profile-v1">
/* TLL public traveler profile 3.0 (pf3, 11 Oct 2026). Approved proposal reports/profile-map-3.0/2026-10-10-proposed-changes.md,
   rows P1 to P13, Nancy: "Go with defaults". Loads last in the template head and only restyles. Every element, id, data-*
   attribute and CMS binding stays; tll-prof-v2, tll-prof-dir-v1 and the J14 tag stay and are overridden here by load order.
   Display is never forced with !important on nodes that scripts hide inline (stats, voice cards, link rows, empty states).
   Tokens: ink #0A0B14, cream #F7F1E8, paper #FDF9F3, line #E0DACE, muted #6B6660, teal #067A79 (light) / #00C9C8 (on ink),
   rose #F0507A (on ink), rose text #C8325B (on light), amber text #8A5A12. Motion: hover/press only, 150ms ease-out. */
.tll-traveler-profile{--pf3-ink:#0A0B14;--pf3-cream:#F7F1E8;--pf3-paper:#FDF9F3;--pf3-line:#E0DACE;--pf3-muted:#6B6660;--pf3-text2:#3a3a3a;--pf3-teal:#067A79;--pf3-teal-l:#00C9C8;--pf3-rose:#F0507A;--pf3-rose-t:#C8325B;--pf3-amber-t:#8A5A12;--pf3-stitch:#c9b89a;--pf3-head:'Playfair Display',Georgia,serif;--pf3-body:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;--pf3-mono:'JetBrains Mono',ui-monospace,monospace;--pf3-ease:cubic-bezier(.23,1,.32,1);background:var(--pf3-cream)}

/* P1. Page frame: one cream sheet, one 900px column, 28px gutter (16px under 480px). */
.tll-traveler-profile [data-tll-prof="hero"],.tll-traveler-profile [data-tll-prof="voice"],.tll-traveler-profile [data-tll-prof="links"],.tll-traveler-profile [data-tll-prof="filed"]{background:var(--pf3-cream) !important;background-image:none !important;color:var(--pf3-ink) !important}
.tll-traveler-profile [data-tll-prof="hero"]{padding:clamp(40px,9vh,88px) 0 0 !important}
.tll-traveler-profile [data-tll-prof="voice"]{padding:4px 0 0 !important}
.tll-traveler-profile [data-tll-prof="links"]{padding:28px 0 0 !important}
.tll-traveler-profile [data-tll-prof="filed"]{padding:28px 0 clamp(64px,12vh,120px) !important}
.tll-traveler-profile [data-tll-prof="hero"] > .tll-container,.tll-traveler-profile [data-tll-prof="voice"] > .tll-container,.tll-traveler-profile [data-tll-prof="links"] > .tll-container,.tll-traveler-profile [data-tll-prof="filed"] > .tll-container{max-width:900px !important;padding-left:28px !important;padding-right:28px !important;box-sizing:border-box}

/* P2. Luggage tag: paper tag on cream, grommet 24px in, stitch at 58px, avatar 84px with a 3px rose ring. Tilt from J14 stays. */
.tll-traveler-profile .tll-prof-tagwrap{filter:drop-shadow(0 14px 28px rgba(10,11,20,.12));margin:0 0 28px}
.tll-traveler-profile [data-tll-prof="hero-grid"]{background-color:var(--pf3-paper) !important;padding:34px 30px 28px 78px !important;gap:20px !important;align-items:center !important;flex-wrap:wrap;clip-path:polygon(0 26px,26px 0,100% 0,100% 100%,26px 100%,0 calc(100% - 26px)) !important;background-image:repeating-linear-gradient(180deg,var(--pf3-stitch) 0 6px,transparent 6px 12px) !important;background-size:1.5px calc(100% - 36px) !important;background-position:58px 18px !important;background-repeat:no-repeat !important}
.tll-traveler-profile [data-tll-prof="hero-grid"]::before{left:24px !important;background:var(--pf3-cream) !important;box-shadow:inset 0 0 0 4px var(--pf3-stitch) !important}
.tll-traveler-profile [data-tll-prof="hero-grid"]::after{left:auto !important;right:22px !important;top:14px !important;color:var(--pf3-muted) !important}
.tll-traveler-profile [data-tll-prof="avatar-img"]{width:84px !important;height:84px !important;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--pf3-rose) !important;background:#1d5e5d !important}
.tll-traveler-profile [data-tll-prof="hero-id"]{flex:1 1 260px;min-width:0 !important;display:block}

/* P3. Chips: Badge in rose tint, Directory flags and Traveler Category in grey, Fun title in amber tint. */
.tll-traveler-profile [data-tll-prof="badges"]{gap:6px !important;margin:0 0 8px !important}
.tll-traveler-profile [data-tll-prof="badges"] > div{font-family:var(--pf3-mono) !important;font-size:10.5px !important;font-weight:600 !important;letter-spacing:.1em !important;text-transform:uppercase;line-height:1.4;padding:3px 10px !important;border-radius:4px !important;border:1px solid var(--pf3-line) !important;background:#F5F1E9 !important;color:var(--pf3-muted) !important}
.tll-traveler-profile [data-tll-prof="badges"] > [data-tll-prof="badge-role"]{color:var(--pf3-rose-t) !important;background:rgba(240,80,122,.08) !important;border-color:rgba(240,80,122,.4) !important}
.tll-traveler-profile [data-tll-prof="badges"] > [data-tll-prof="badge-fun"]{color:var(--pf3-amber-t) !important;background:rgba(217,138,43,.12) !important;border-color:rgba(217,138,43,.5) !important}
.tll-traveler-profile [data-tll-prof="badges"] > .pf3-dupe{display:none !important}

/* Name (the one h1). */
.tll-traveler-profile [data-tll-prof="name"]{display:block;font-family:var(--pf3-head) !important;font-weight:800 !important;font-size:clamp(34px,4.2vw,64px) !important;line-height:.95 !important;letter-spacing:-.025em !important;text-wrap:balance;color:var(--pf3-ink) !important;margin:0 0 8px !important;padding-bottom:.04em}

/* P4. One mono line: Location, then Lives in / Knows (Directory), then Speaks (Directory), then pronouns, as one inline run so the
   separators wrap with the words. pf3 js moves Speaks and pronouns behind Lives in. Currently In hidden on screen (J15). */
.tll-traveler-profile [data-tll-prof="meta"]{display:none !important}
.tll-traveler-profile [data-tll-prof="dir-hero"]:not([hidden]){display:contents}
.tll-traveler-profile [data-tll-prof="home"],.tll-traveler-profile [data-tll-prof="dir-lives"],.tll-traveler-profile [data-tll-prof="pronouns"],.tll-traveler-profile [data-tll-prof="hero-id"] [data-pf3="langs"]{display:inline;font-family:var(--pf3-mono) !important;font-size:11px !important;letter-spacing:.06em !important;text-transform:uppercase;line-height:1.7;color:var(--pf3-muted) !important;margin:0 !important}
.tll-traveler-profile [data-tll-prof="hero-id"] [data-pf3="langs"]::before{content:"Speaks "}
.tll-traveler-profile .pf3-sep::before{content:"\00B7";margin:0 .6em;color:var(--pf3-muted)}
.tll-traveler-profile [data-tll-prof="hero-id"] [data-pf3="langs"].pf3-sep::before{content:"\00B7\00A0\00A0Speaks "}
.tll-traveler-profile [data-tll-prof="dir-tags-label"]{display:block;font-family:var(--pf3-mono) !important;font-size:10.5px !important;letter-spacing:.14em !important;text-transform:uppercase;color:var(--pf3-teal) !important;font-weight:600;margin:12px 0 6px !important}
.tll-traveler-profile [data-tll-prof="dir-tags"] span{font-family:var(--pf3-mono) !important;font-size:10.5px !important;letter-spacing:.06em !important;color:var(--pf3-text2) !important;background:var(--pf3-paper);border:1px solid var(--pf3-line) !important;border-radius:999px;padding:4px 10px}

/* P5. Stats: Playfair 800 23px in teal, mono labels, one row of four under the tag (two by two under 480px). */
.tll-traveler-profile [data-tll-prof="stats"]{display:grid !important;grid-template-columns:repeat(4,auto);justify-content:start;column-gap:clamp(22px,4vw,40px);row-gap:16px;margin:0 0 24px !important;padding:0 !important;border:0 !important}
.tll-traveler-profile [data-tll-prof="stat"] > :first-child{font-family:var(--pf3-head) !important;font-weight:800 !important;font-size:23px !important;line-height:1.1 !important;color:var(--pf3-teal) !important;margin:0 !important;font-variant-numeric:lining-nums tabular-nums}
.tll-traveler-profile [data-tll-prof="stat-label"]{font-family:var(--pf3-mono) !important;font-size:10px !important;font-weight:600 !important;letter-spacing:.1em !important;text-transform:uppercase;color:var(--pf3-muted) !important;margin:4px 0 0 !important;line-height:1.4 !important}
.tll-traveler-profile [data-tll-prof="stat"].pf3-pending > :first-child{visibility:hidden}

/* P6 and P7. Trust me (paper box) and One strong opinion (ink box), stacked. Each card still hides when its field is empty. */
.tll-traveler-profile [data-tll-prof="voice-grid"]{grid-template-columns:minmax(0,1fr) !important;gap:13px !important}
.tll-traveler-profile [data-tll-prof="voice-card"]{border-radius:4px !important;padding:15px 18px !important;background:var(--pf3-paper) !important;border:1px solid var(--pf3-line) !important}
.tll-traveler-profile [data-tll-prof="voice-card"][data-tll-field="opinion"]{background:var(--pf3-ink) !important;border-color:var(--pf3-ink) !important;padding:17px 21px !important}
.tll-traveler-profile [data-tll-prof="voice-label"]{font-family:var(--pf3-mono) !important;font-size:10.5px !important;font-weight:600 !important;letter-spacing:.14em !important;text-transform:uppercase;line-height:1.4 !important;color:var(--pf3-teal) !important;margin:0 0 6px !important}
.tll-traveler-profile [data-tll-field="opinion"] [data-tll-prof="voice-label"]{color:var(--pf3-rose) !important;margin-bottom:7px !important}
.tll-traveler-profile [data-tll-prof="trust"]{font-family:var(--pf3-body) !important;font-weight:400 !important;font-style:italic;font-size:15px !important;line-height:1.5 !important;color:var(--pf3-text2) !important}
.tll-traveler-profile [data-tll-prof="opinion"]{font-family:var(--pf3-head) !important;font-weight:800 !important;font-size:19px !important;line-height:1.25 !important;color:var(--pf3-cream) !important;text-wrap:pretty}

/* P8. Find {First} elsewhere: mono teal label, rows with a 36px ink badge, teal code and a teal arrow. Rows stay real links. */
.tll-traveler-profile [data-tll-prof="links-title"],.tll-traveler-profile [data-tll-prof="filed-title"]{font-family:var(--pf3-mono) !important;font-size:11px !important;font-weight:600 !important;letter-spacing:.18em !important;text-transform:uppercase;line-height:1.4 !important;color:var(--pf3-teal) !important;margin:0 0 10px !important}
.tll-traveler-profile [data-tll-prof="links-list"],.tll-traveler-profile [data-tll-prof="dir-links"]{gap:8px !important;max-width:520px !important}
.tll-traveler-profile [data-tll-prof="dir-links"]{margin-bottom:8px !important}
.tll-traveler-profile [data-tll-link]{display:grid;grid-template-columns:36px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:13px;align-items:center;min-height:44px;box-sizing:border-box;background:var(--pf3-paper) !important;border:1px solid var(--pf3-line) !important;border-radius:4px !important;padding:12px 16px !important;color:var(--pf3-ink) !important;text-decoration:none !important;transition:border-color 150ms ease-out,transform 150ms ease-out !important;transform:none}
.tll-traveler-profile [data-tll-link]::before{content:"LINK";grid-column:1;grid-row:1 / span 2;width:36px;height:36px;border-radius:50%;background:var(--pf3-ink);color:var(--pf3-teal-l);font:700 10px/1 var(--pf3-mono);letter-spacing:.03em;display:flex;align-items:center;justify-content:center}
.tll-traveler-profile [data-tll-link]::after{content:"\2197";grid-column:3;grid-row:1 / span 2;font:700 13px/1 var(--pf3-mono);color:var(--pf3-teal)}
.tll-traveler-profile [data-tll-link="linkedin-url-2"]::before{content:"LI"}
.tll-traveler-profile [data-tll-link="substack-url-2"]::before,.tll-traveler-profile [data-tll-link="dir-newsletter"]::before{content:"SUB"}
.tll-traveler-profile [data-tll-link="instagram-url"]::before,.tll-traveler-profile [data-tll-link="dir-instagram"]::before{content:"IG"}
.tll-traveler-profile [data-tll-link="strava-url-2"]::before,.tll-traveler-profile [data-tll-link="dir-strava"]::before{content:"STRAVA";font-size:7.5px;letter-spacing:0}
.tll-traveler-profile [data-tll-link="website-url"]::before,.tll-traveler-profile [data-tll-link="dir-website"]::before{content:"WEB"}
.tll-traveler-profile [data-tll-link="youtube-url"]::before,.tll-traveler-profile [data-tll-link="dir-youtube"]::before{content:"YT"}
.tll-traveler-profile [data-tll-link="tiktok-url"]::before,.tll-traveler-profile [data-tll-link="dir-tiktok"]::before{content:"TT"}
.tll-traveler-profile [data-tll-link="x-url"]::before{content:"X"}
.tll-traveler-profile [data-tll-link="threads-url"]::before{content:"THR"}
.tll-traveler-profile [data-tll-link="vimeo-url"]::before{content:"VIM"}
.tll-traveler-profile [data-tll-link="press-kit-url"]::before{content:"KIT"}
.tll-traveler-profile [data-tll-link] [data-tll-prof="link-platform"]{grid-column:2;grid-row:1;font-family:var(--pf3-body) !important;font-weight:700 !important;font-size:15px !important;line-height:1.25 !important;color:var(--pf3-ink) !important;margin:0 !important}
.tll-traveler-profile [data-tll-link] [data-tll-prof="link-url"]{grid-column:2;grid-row:2;font-family:var(--pf3-mono) !important;font-size:11px !important;letter-spacing:0 !important;color:var(--pf3-muted) !important;max-width:100% !important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tll-traveler-profile [data-tll-link]:hover{transform:none;box-shadow:none}
.tll-traveler-profile [data-tll-prof="links-empty"],.tll-traveler-profile [data-tll-prof="filed-empty"]{border:1.5px dashed var(--pf3-stitch) !important;border-radius:4px !important;padding:16px 18px !important;text-align:left !important;font-family:var(--pf3-body);font-size:15px !important;line-height:1.5;color:var(--pf3-muted) !important;max-width:520px !important;background:transparent}

/* P9. Get in touch and Report: kept under the links, restyled. Still hidden unless the Directory item allows contact. */
.tll-traveler-profile [data-tll-prof="dir-contact"]{max-width:520px !important;margin-top:20px !important;gap:6px !important}
.tll-traveler-profile [data-tll-prof="dir-contact-btn"]:not([hidden]){display:inline-flex !important;align-items:center;min-height:44px;box-sizing:border-box;padding:0 22px !important;background:var(--pf3-ink) !important;color:var(--pf3-cream) !important;border-radius:999px !important;font:700 12px/1 var(--pf3-mono) !important;letter-spacing:.1em !important;text-transform:uppercase;text-decoration:none !important;transition:background-color 150ms ease-out,transform 150ms ease-out}
.tll-traveler-profile [data-tll-prof="dir-contact-note"]{font-family:var(--pf3-mono) !important;font-size:11px !important;letter-spacing:.04em !important;text-transform:none !important;color:var(--pf3-muted) !important;line-height:1.6 !important}
.tll-traveler-profile [data-tll-prof="dir-report"]{display:inline-flex;align-items:center;min-height:44px;margin-top:0 !important;color:var(--pf3-muted) !important;text-decoration:underline !important;text-decoration-color:var(--pf3-line) !important;text-underline-offset:4px;transition:color 150ms ease-out}
.tll-traveler-profile [data-tll-prof="dir-report"]:hover{color:var(--pf3-muted) !important}

/* P10. Filed by {First}: two columns (one under 600px), photo on the left, mono teal meta, Playfair 15px title. */
.tll-traveler-profile [data-tll-prof="filed-title"]{color:var(--pf3-rose-t) !important;margin-bottom:12px !important}
.tll-traveler-profile [data-tll-prof="filed-list"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:13px !important}
.tll-traveler-profile .tll-prof-story{display:flex;align-items:stretch;min-height:82px;padding:0 !important;overflow:hidden;background:var(--pf3-paper) !important;border:1px solid var(--pf3-line) !important;border-radius:4px !important;color:var(--pf3-ink) !important;text-decoration:none !important;box-shadow:none !important;transform:none;transition:border-color 150ms ease-out,transform 150ms ease-out !important}
.tll-traveler-profile .tll-prof-story:hover{transform:none;box-shadow:none !important}
.tll-traveler-profile .pf3-story-img{flex:none;display:block;width:105px;height:auto;min-height:82px;object-fit:cover;background:var(--pf3-ink);margin:0;border:0}
.tll-traveler-profile .pf3-story-body{display:block;min-width:0;padding:11px 13px}
.tll-traveler-profile .tll-prof-story-meta{font-family:var(--pf3-mono) !important;font-size:10px !important;letter-spacing:.06em !important;text-transform:uppercase;color:var(--pf3-teal) !important;margin:0 0 4px !important}
.tll-traveler-profile .tll-prof-story-title{font-family:var(--pf3-head) !important;font-weight:800 !important;font-size:15px !important;line-height:1.2 !important;color:var(--pf3-ink) !important;text-wrap:pretty}

/* P11. Disclosure in a paper box, copy unchanged. */
.tll-traveler-profile [data-tll-prof="disclosure"]{background:var(--pf3-paper);border:1px solid var(--pf3-line);border-radius:4px;padding:12px 16px !important;margin:24px 0 0 !important;font-family:var(--pf3-body) !important;font-size:13px !important;letter-spacing:0 !important;text-transform:none !important;line-height:1.5 !important;color:var(--pf3-muted) !important}

/* Hidden helpers (P4 languages before they move into the tag, P5 owner key). */
[data-pf3="owner"],[data-tll-prof="dir-src"] [data-pf3="langs"]{display:none !important}

/* Focus: 3px, ink on light, teal on ink. */
.tll-traveler-profile a:focus-visible,.tll-traveler-profile [data-tll-link]:focus-visible,.tll-traveler-profile .tll-prof-story:focus-visible{outline:3px solid var(--pf3-ink) !important;outline-offset:2px !important;border-radius:4px}
.tll-traveler-profile [data-tll-prof="dir-contact-btn"]:focus-visible{outline:3px solid var(--pf3-ink) !important;outline-offset:3px !important;border-radius:999px !important}

/* Motion: hover and press only on fine pointers (hover:hover), 150ms ease-out; none under reduced motion. */
@media (hover:hover) and (pointer:fine){
  .tll-traveler-profile [data-tll-link]:hover,.tll-traveler-profile .tll-prof-story:hover{border-color:var(--pf3-teal) !important}
  .tll-traveler-profile [data-tll-prof="dir-contact-btn"]:hover{background:#23263c !important}
  .tll-traveler-profile [data-tll-prof="dir-report"]:hover{color:var(--pf3-rose-t) !important;text-decoration-color:currentColor !important}
  .tll-traveler-profile [data-tll-link]:active,.tll-traveler-profile .tll-prof-story:active,.tll-traveler-profile [data-tll-prof="dir-contact-btn"]:active{transform:scale(.97)}
}

/* Responsive. */
@media (max-width:700px){
  .tll-traveler-profile [data-tll-prof="hero"]{padding-top:40px !important}
  .tll-traveler-profile [data-tll-prof="hero-grid"]{padding:40px 18px 22px 56px !important;gap:16px !important;background-position:40px 18px !important;clip-path:polygon(0 20px,20px 0,100% 0,100% 100%,20px 100%,0 calc(100% - 20px)) !important}
  .tll-traveler-profile [data-tll-prof="hero-grid"]::before{left:12px !important}
  .tll-traveler-profile [data-tll-prof="hero-grid"]::after{right:14px !important;top:13px !important}
  .tll-traveler-profile [data-tll-prof="avatar-img"]{width:72px !important;height:72px !important}
}
@media (max-width:600px){.tll-traveler-profile [data-tll-prof="filed-list"]{grid-template-columns:minmax(0,1fr) !important}}
@media (max-width:480px){
  .tll-traveler-profile [data-tll-prof="hero"] > .tll-container,.tll-traveler-profile [data-tll-prof="voice"] > .tll-container,.tll-traveler-profile [data-tll-prof="links"] > .tll-container,.tll-traveler-profile [data-tll-prof="filed"] > .tll-container{padding-left:16px !important;padding-right:16px !important}
  .tll-traveler-profile [data-tll-prof="stats"]{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .tll-traveler-profile .tll-prof-tagwrap{transform:none !important}
  .tll-traveler-profile [data-tll-link],.tll-traveler-profile .tll-prof-story,.tll-traveler-profile [data-tll-prof="dir-contact-btn"],.tll-traveler-profile [data-tll-prof="dir-report"]{transition:none !important}
  .tll-traveler-profile [data-tll-link]:active,.tll-traveler-profile .tll-prof-story:active,.tll-traveler-profile [data-tll-prof="dir-contact-btn"]:active{transform:none}
}
</style>
