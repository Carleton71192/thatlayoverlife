<style id="tll-ct3-country-v1">
/* TLL country page 3.0 (ct3, 12 Oct 2026). Approved proposal reports/country-destinations-3.0/2026-10-11-proposed-changes.md,
   rows C1 to C15, Nancy: "Go with defaults". Last in the template head; restyles only. Every element, id, data-* attribute and
   CMS binding stays. The body embed (.tllcx-*) and the footer style tll-ctry-v2-css load later, so rules here carry an html prefix.
   Tokens: ink #0A0B14, cream #F7F1E8, paper #FDF9F3, line #E0DACE, muted #6B6660, teal #067A79 (light) / #00C9C8 (on ink),
   rose #F0507A (large italic accent), rose text #C8325B (small, on light), rose button #D63859 with white, amber text #8A5A12.
   Radius: cards 4px, controls and chips pill. Motion: hover and press only, 150ms ease-out, none with reduced motion. */
:root{--ct3-ink:#0A0B14;--ct3-cream:#F7F1E8;--ct3-paper:#FDF9F3;--ct3-line:#E0DACE;--ct3-muted:#6B6660;--ct3-teal:#067A79;--ct3-teal-l:#00C9C8;--ct3-rose:#F0507A;--ct3-rose-t:#C8325B;--ct3-rose-b:#D63859;--ct3-amber:#8A5A12;--ct3-stitch:#c9b89a;--ct3-ink-2:#9496AC;--ct3-head:'Playfair Display',Georgia,serif;--ct3-body:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;--ct3-mono:'JetBrains Mono',ui-monospace,monospace}

/* C1, C2. Hero: photo from the referenced story, plain Ink band without one. Content sits at the foot of a 1000px column. */
html .tllcx-hero{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:300px;padding:72px 24px 32px;background:var(--ct3-ink);color:var(--ct3-cream);box-sizing:border-box}
html .tllcx-hero:before{display:none}
html .tllcx-hero>img[data-ct3="hero-img"]{position:absolute;top:0;left:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;z-index:0;display:block;border:0}
html .tllcx-hero>img[data-ct3="hero-img"].w-dyn-bind-empty,html .tllcx-hero.ct3-nophoto>img[data-ct3="hero-img"]{display:none}
html .tllcx-hero:has(>img[data-ct3="hero-img"]:not(.w-dyn-bind-empty)):not(.ct3-nophoto):after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(10,11,20,.5) 0%,rgba(10,11,20,.2) 38%,rgba(10,11,20,.94) 100%)}
html .tllcx-hero>.tllcx-wrap{position:relative;z-index:2;width:100%;max-width:1000px;margin:0 auto}
html .tllcx-hero .tllcx-flag{font-size:30px;line-height:38px;height:38px;margin:0 0 14px}
html .tllcx-hero .tllcx-flag.w-dyn-bind-empty:not(.ct3-flagged){display:none}
html .tllcx-hero .tllcx-flag img{display:none}
html .tllcx-hero .tllcx-flag.ct3-flagged{font-size:0}
html .tllcx-hero .tllcx-flag.ct3-flagged img{display:block;width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(247,241,232,.35)}
html .tllcx-hero>.tllcx-wrap>.tll-eyebrow-teal{display:none}
html .tllcx-hero h1{font-family:var(--ct3-head);font-weight:800;font-size:clamp(34px,4.2vw,64px);line-height:1.04;letter-spacing:-.01em;color:var(--ct3-cream);margin:0 0 10px;text-wrap:balance}
html .tllcx-hero .tllcx-verdict{font-family:var(--ct3-body);font-size:17px;line-height:1.5;color:var(--ct3-cream);max-width:680px;margin:0}
html .tllcx-hero [data-tll-ctry="v2"]{margin:0}
html .tllcx-hero [data-tll-ctry-meta]{font-family:var(--ct3-mono);font-weight:600;font-size:10px;line-height:1.5;letter-spacing:.14em;text-transform:uppercase;color:var(--ct3-teal-l);margin:14px 0 0}
html .tllcx-hero [data-tll-ctry-meta]:empty{display:none}

/* C3. Paper bar under the hero: Been here / Want to go (tll-ctry-v2-js), the status note, and the member's own map line. */
html [data-ct3="bar"]{background:var(--ct3-paper);padding:20px 24px 0}
html [data-ct3="bar-wrap"]{max-width:1000px;margin:0 auto}
html [data-ct3="bar"] [data-tll-places]{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:0;padding:12px 14px;background:var(--ct3-paper);border:1px solid var(--ct3-line);border-radius:4px}
html [data-ct3="bar"] [data-tll-places] [data-tll-place-toggle]{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 18px;margin:0;box-sizing:border-box;border:1.5px solid var(--ct3-ink);border-radius:999px;background:transparent;color:var(--ct3-ink);font-family:var(--ct3-body);font-weight:600;font-size:14px;line-height:1;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
html [data-ct3="bar"] [data-tll-places] .tll-place-btn-been-on{background:var(--ct3-teal);border-color:var(--ct3-teal);color:var(--ct3-cream)}
html [data-ct3="bar"] [data-tll-places] .tll-place-btn-want-on{background:var(--ct3-rose-b);border-color:var(--ct3-rose-b);color:#fff}
html [data-ct3="bar"] [data-tll-places] [data-tll-place-toggle]:focus-visible{outline:3px solid var(--ct3-ink);outline-offset:2px}
html [data-ct3="bar"] [data-tll-places-note]{margin:0 0 0 auto;font-family:var(--ct3-mono);font-weight:600;font-size:10px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;color:var(--ct3-muted)}
html [data-ct3="onmap"]{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:0 16px;margin:2px 0 0;padding-top:6px;border-top:1px solid var(--ct3-line);font-family:var(--ct3-mono);font-weight:600;font-size:10px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;color:var(--ct3-muted)}

html [data-ct3="onmap"] b{font-weight:600;color:var(--ct3-ink)}

/* Body column. */
html .tllcx-body{background:var(--ct3-paper);padding:40px 24px 72px}
html .tllcx-body>.tllcx-wrap{max-width:1000px;margin:0 auto}

/* C4. Quick answers from the referenced story. The open slot keeps its look when there is no story. */
html [data-ct3="qa-src"]{display:none!important}
html [data-tll-ctry-qa]{border-radius:4px;margin:0 0 48px}

html [data-ct3="qa-list"] .ct3-qa-a,html [data-ct3="qa-list"] .ct3-qa-a p,html [data-ct3="qa-list"] .ct3-qa-a li{font-family:var(--ct3-body);font-size:15px;line-height:1.55;color:#2b2b30;margin:0}

/* C5. Quick facts under Quick answers: h2 "{Country} at a glance", honest check note, two-column list on Cream. */
html .tllcx-body .tllcx-wrap>.tllcx-eb{font-family:var(--ct3-head);font-weight:800;font-size:clamp(24px,2.6vw,30px);line-height:1.15;letter-spacing:0;text-transform:none;color:var(--ct3-ink);margin:0 0 6px}

/* C6. One word to know: hidden when the item has no word. */

/* C7. Filed from {Country}: the story card with its photo, pillar and reading time. */
html #tll-filed{margin:0 0 48px}

html #tll-filed .tllcx-filed-title{font-family:var(--ct3-head);font-weight:800;font-size:17px;line-height:1.3;color:var(--ct3-ink);margin-top:8px}
html #tll-filed .tllcx-filed-card:not(:has([data-ct3="filed-kicker"])) .tllcx-filed-title{margin-top:18px}
