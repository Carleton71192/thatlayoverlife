<script>
/* tll-country-filed-v2 */
(function(){
  var d=window.TLL_FILED||{},box=document.getElementById('tll-filed'),a=document.getElementById('tll-filed-link'),t=document.getElementById('tll-filed-title');
  var n=0;
  if(box&&a&&t){
    if(d.slug&&d.slug.indexOf('{{')<0){a.setAttribute('href','/stories/'+d.slug);t.textContent=d.name||'Read the story';n++;}
    else{a.style.display='none';}
  }
  var m=location.pathname.match(/\/countries\/([^\/?#]+)/);
  var slug=m?decodeURIComponent(m[1]).toLowerCase():'';
  function wire(id,prefix){
    var w=document.getElementById(id);
    if(!w||!slug){return;}
    var k=0;
    [].forEach.call(w.querySelectorAll('.w-dyn-item'),function(it){
      var f=it.querySelector('.tllcf-cflag');
      var v=f?f.textContent.trim().toLowerCase():'';
      if(v===slug){
        k++;
        var c=it.querySelector('a.tllcf-card');
        if(c&&c.id){c.setAttribute('href',prefix+c.id);}
      }else{
        it.style.display='none';
      }
    });
    if(k>0){w.style.display='block';}
    n+=k;
  }
  wire('tllcf-layovers','/layovers/');
  wire('tllcf-races','/marathon-diaries/');
  wire('tllcf-diary','/paw-passport/');
  if(n===0&&box){var e=box.querySelector('.tllcx-filed-eyebrow');if(e){e.textContent='Nothing filed from here yet';}}
  window.TLL_FILED_N=n;
  [].forEach.call(document.querySelectorAll('.tllcx-label'),function(l){
    if(l.textContent.trim()==='Population'){var v=l.nextElementSibling;if(v&&/^\d{4,}$/.test(v.textContent.trim()))v.textContent=Number(v.textContent.trim()).toLocaleString('en-US');}
  });
})();
</script>

<script id="tll-ctry-v2-js">
/* TLL country page v2 (2026-09-28, design screen 10). Hero meta line from real data (region from the CMS, stories filed counted from the cards on this page).
   Been here / Want to go writes member JSON tllPlaces keyed by country name, never tllStates (D03). On the wire reads the Travel Wire Worker for this ISO2.
   Quick answers and reader submissions are honest open slots until real answers exist. */
(function(){
  function txt(sel){var n=document.querySelector(sel);return n&&!n.classList.contains('w-dyn-bind-empty')?n.textContent.trim():'';}
  function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
  function meta(){
    var M=document.querySelector('[data-tll-ctry-meta]');if(!M)return;
    var region=txt('.tllcx-hero [class*=eyebrow]');var n=window.TLL_FILED_N||0;
    var parts=[];if(region)parts.push(region);parts.push(n+(n===1?' story filed':' stories filed'));
    M.textContent=parts.join(' · ');
  }
  function names(){
    var name=txt('[data-tll-place-alt]')||txt('.tllcx-hero h1');if(!name)return;
    var s=document.querySelector('[data-tll-ctry-subs-label]');if(s)s.textContent='Reader submissions · '+name;
    var b=document.querySelector('[data-tll-ctry-subs-body]');if(b)b.textContent='Nothing from the readers yet. The first '+name+' submission gets the slot, reviewed by a human within 48 hours.';
    var w=document.querySelector('[data-tll-ctry-wire-label]');if(w)w.textContent='On the wire · '+name;
    var h=document.querySelector('.tllcx-cta h2');if(h&&/^Been here\?$/.test(h.textContent.trim()))h.textContent='Been to '+name+'?';
  }
  function places(){
    var W=document.querySelector('[data-tll-places]');if(!W||W.dataset.tllDone)return;W.dataset.tllDone='1';
    var name=txt('[data-tll-place-alt]')||txt('.tllcx-hero h1');if(!name){W.style.display='none';return;}
    var key=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    var note=W.querySelector('[data-tll-places-note]');
    var btns={been:W.querySelector('[data-tll-place-toggle="been"]'),want:W.querySelector('[data-tll-place-toggle="want"]')};
    var state=null,ms=null,member=false;
    function paint(){Object.keys(btns).forEach(function(k){var b=btns[k];if(!b)return;var on=state===k;b.classList.toggle('tll-place-btn',!on);b.classList.toggle('tll-place-btn-'+k+'-on',on);b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?(k==='been'?'✓ Been here':'★ On my list'):(k==='been'?'Been here':'Want to go');});if(note)note.textContent=member?'Saves to your lists':'Log in to save';}
    function load(){ms=window.$memberstackDom;if(!ms){paint();return;}ms.getCurrentMember().then(function(r){if(!(r&&r.data)){paint();return;}member=true;return ms.getMemberJSON().then(function(j){var d=(j&&j.data)||{};var p=d.tllPlaces||{};var e=p[key];state=(e&&e.state)||(typeof e==='string'?e:null);paint();});}).catch(function(){paint();});}
    function save(k){if(!member||!ms){location.href='/login?redirect='+encodeURIComponent(location.pathname);return;}state=state===k?null:k;paint();if(note)note.textContent='Saving…';
      ms.getMemberJSON().then(function(j){var d=(j&&j.data)||{};var p=Object.assign({},d.tllPlaces||{});if(state)p[key]={state:state,name:name,at:new Date().toISOString()};else delete p[key];return ms.updateMemberJSON({json:Object.assign({},d,{tllPlaces:p})});}).then(function(){if(note)note.textContent='Saved to your lists';}).catch(function(){if(note)note.textContent='Could not save. Try again.';});}
    Object.keys(btns).forEach(function(k){var b=btns[k];if(b)b.addEventListener('click',function(e){e.preventDefault();save(k);});});
    paint();var n=0,iv=setInterval(function(){if(window.$memberstackDom){clearInterval(iv);load();}else if(++n>40){clearInterval(iv);paint();}},250);
  }
  function wire(){
    var box=document.querySelector('[data-tll-ctry-wire]'),list=document.querySelector('[data-tll-ctry-wire-list]');if(!box||!list)return;
    var iso=txt('[data-tll-ctry-iso]').toUpperCase();if(!/^[A-Z]{2}$/.test(iso))return;
    function ago(s){var d=(Date.now()-new Date(s).getTime())/1e3;if(d<3600)return Math.max(1,Math.round(d/60))+' min ago';if(d<86400)return Math.round(d/3600)+'h ago';return Math.round(d/86400)+'d ago';}
    fetch('https://tll-travel-wire.thatlayoverlife.workers.dev/wire?country='+iso+'&limit=5').then(function(r){return r.json();}).then(function(j){var items=(j&&j.items)||[];if(!items.length)return;
      list.innerHTML=items.map(function(i){return '<div class="tll-ctry-wire-item"><div class="t">'+esc(i.title)+'</div><div class="m">'+esc(i.source)+' · '+esc(ago(i.publishedAt))+' · <a href="'+esc(i.link)+'" target="_blank" rel="noopener">Read at source ↗</a></div></div>';}).join('');
      box.removeAttribute('hidden');}).catch(function(){});
  }
  function run(){meta();names();places();wire();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
<script id="tll-cx-expats-js-v1">
/* Country page expat block (design board D6). Reads Directory and Resources data nodes rendered by the two collection lists, matches on the country name, never ranks. Empty states are honest. */
(function(){
  var S=document.querySelector('[data-tll-cx-expats]'); if(!S) return;
  var name=(S.getAttribute('data-tll-cx-name')||'').trim(); if(!name||name.indexOf('{{')>-1){ var h=document.querySelector('.tllcx-hero h1'); name=h?h.textContent.trim():''; }
  if(!name){ S.style.display='none'; return; }
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var norm=function(s){return String(s||'').trim().toLowerCase()};
  [].forEach.call(S.querySelectorAll('[data-tll-cx-country]'),function(e){e.textContent=name});
  var sug=S.querySelector('[data-tll-cx-suggest]'); if(sug) sug.href='mailto:hello@thatlayover.life?subject='+encodeURIComponent('RESOURCE · '+name);
  var BADGE={instagram:['IG','ig'],tiktok:['TT','tt'],youtube:['YT','yt'],strava:['SS','ss'],newsletter:['NL',''],website:['WEB',''],blog:['WEB',''],other:['LINK','']};
  var people=[].slice.call(S.querySelectorAll('[data-tll-dir]')).map(function(n){var d=n.dataset,links=[];try{links=JSON.parse(d.links||'[]')}catch(e){}var flags=(d.flags||'').split(/\s+/);var img=n.querySelector('img');return {name:d.name||'',slug:d.slug||'',lives:d.lives||'',since:d.since||'',knows:d.knows||'',tags:d.tags||'',links:links,cmode:norm(d.cmode),ig:d.ig||'',wa:d.wa||'',relay:flags.indexOf('relay')>-1,photo:img?img.getAttribute('src')||'':''}}).filter(function(p){return p.name});
  var now=people.filter(function(p){return norm(p.lives)===norm(name)});
  var lived=people.filter(function(p){return norm(p.lives)!==norm(name)&&p.knows.split(',').map(norm).indexOf(norm(name))>-1});
  for(var i=now.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=now[i];now[i]=now[j];now[j]=t}
  for(var k=lived.length-1;k>0;k--){var l=Math.floor(Math.random()*(k+1));var u=lived[k];lived[k]=lived[l];lived[l]=u}
  function contact(p){ if(p.cmode==='none') return ''; if(p.ig) return 'https://www.instagram.com/'+encodeURIComponent(p.ig.replace(/^@/,'')); if(p.wa&&/^https:\/\/wa\.me\/message\//i.test(p.wa)) return p.wa; if(p.relay) return '/contact?relay='+encodeURIComponent(p.slug); return ''; }
  function card(p){
    var sub='Lives in '+esc(p.lives)+(p.since?' since '+esc(p.since):'')+(p.knows?' · Knows '+esc(p.knows):'');
    var tags=p.tags.split(',').map(function(t){return t.trim()}).filter(Boolean).slice(0,5).map(function(t){return '<span class="tlldir-tag">'+esc(t)+'</span>'}).join('');
    var links=p.links.slice(0,4).map(function(x){var b=BADGE[x.type]||BADGE.other;return '<a class="tlldir-badge tlldir-badge--'+b[1]+'" href="'+esc(x.url)+'" target="_blank" rel="noopener nofollow ugc" aria-label="'+esc(x.type)+'">'+b[0]+'</a>'}).join('');
    var ch=contact(p); var c=ch?'<a class="tlldir-contact" href="'+esc(ch)+'"'+(/^https?:/.test(ch)?' target="_blank" rel="noopener nofollow ugc"':'')+'>Contact open</a>':'';
    var av=p.photo?'<img src="'+esc(p.photo)+'" alt="" loading="lazy">':esc(p.name.charAt(0));
    var nm=p.slug?'<a href="/contributors/'+esc(p.slug)+'">'+esc(p.name)+'</a>':esc(p.name);
    return '<article class="tlldir-card"><div class="tlldir-top"><div class="tlldir-avatar">'+av+'</div><div><h3 class="tlldir-name">'+nm+'</h3><p class="tlldir-sub">'+sub+'</p></div></div>'+(tags?'<div class="tlldir-tags">'+tags+'</div>':'')+'<div class="tlldir-links">'+links+c+'</div><a class="tlldir-report" href="mailto:hello@thatlayover.life?subject='+encodeURIComponent('REPORT · '+p.name+' · /countries/'+name)+'">Report this profile</a></article>';
  }
  var counts=S.querySelector('[data-tll-cx-counts]'), grid=S.querySelector('[data-tll-cx-grid]'), empty=S.querySelector('[data-tll-cx-empty]'), join=S.querySelector('[data-tll-cx-join]');
  if(counts) counts.innerHTML='<span>Lives there now · '+now.length+'</span><span>Has lived there · '+lived.length+'</span>';
  var all=now.concat(lived);
  if(all.length){ grid.innerHTML=all.map(card).join(''); if(join) join.removeAttribute('hidden'); }
  else { grid.innerHTML=''; if(empty){ var line=empty.querySelector('[data-tll-cx-emptyline]'); if(line) line.textContent='Nobody here yet. Lived in '+name+'? Put yourself on the map.'; empty.removeAttribute('hidden'); } }
  var res=[].slice.call(S.querySelectorAll('[data-tll-res]')).map(function(n){var d=n.dataset;return {name:d.name||'',type:d.type||'',url:d.url||'',host:d.host||'',note:d.note||'',country:d.country||''}}).filter(function(r){return r.name&&r.url&&norm(r.country)===norm(name)});
  var list=S.querySelector('[data-tll-cx-reslist]'), note=S.querySelector('[data-tll-cx-resnote]');
  if(res.length){ list.innerHTML=res.map(function(r){return '<a href="'+esc(r.url)+'" target="_blank" rel="noopener nofollow"><div class="n"><span>'+esc(r.name)+'</span><span class="t">'+esc(r.type)+'</span></div>'+(r.note?'<p class="d">'+esc(r.note)+'</p>':'')+(r.host?'<div class="h">'+esc(r.host)+' ↗</div>':'')+'</a>'}).join(''); }
  else { list.innerHTML='<p class="d" style="margin:0;font-size:13px;color:#6B6660">None listed yet for '+esc(name)+'. Every entry is opened and checked by a human before it goes up.</p>'; if(note) note.style.display='none'; }
})();
</script>
