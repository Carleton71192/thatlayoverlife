<script>
/* TLL Travel Wire renderer v1.3 · hooks: #wire-chips #wire-status #wire-list #wire-sources · endpoint: workers.dev /wire · teal ruling 2026-08-23: Deep Maldives #067A79 on light surfaces
   v1.2 (2026-09-21, approved by Nancy): military and defence stories filtered out, and no single source may fill more than 6 slots.
   v1.3 (2026-09-29, screen 08): country line under the region tag, from the Worker's ISO2 tag via the browser's own country names. The design's "Layover angle" take is left out: there is no editorial source for it yet. */
(function(){
var EP='https://tll-travel-wire.thatlayoverlife.workers.dev/wire';
var REGIONS=['ALL','EUROPE','ASIA','AMERICAS','AFRICA','MIDDLE EAST','OCEANIA'];
var RC={'EUROPE':'#F0507A','ASIA':'#067A79','AMERICAS':'#D98A2B','AFRICA':'#067A79','MIDDLE EAST':'#C8425E','OCEANIA':'#6B6660','GLOBAL':'#4a4d63'};
var BLOCK=/\b(military|missiles?|fighter jets?|eurofighter|typhoons? jets?|f-?35|f-?16|f-?15|f-?22|b-?52|air force|raf|luftwaffe|black ?hawk|apache|chinook|bombers?|warplanes?|warships?|airstrikes?|drone strikes?|strike aircraft|navy|naval|army|troops|defen[cs]e (ministry|contract|budget|forces)|pentagon|nato|combat|munitions?|weapons?|ballistic|interceptor|stealth)\b/i;
var CAP=6;
var DN=null;try{DN=new Intl.DisplayNames(['en'],{type:'region'});}catch(e){}
function cname(c){if(!c)return '';try{return (DN&&DN.of(c))||c;}catch(e){return c;}}
function curate(items){var per={};return items.filter(function(i){var t=(i.title||'')+' '+(i.summary||'');if(BLOCK.test(t))return false;var s=i.source||'?';per[s]=(per[s]||0)+1;return per[s]<=CAP;});}
var chips=document.getElementById('wire-chips'),list=document.getElementById('wire-list'),status=document.getElementById('wire-status'),srcs=document.getElementById('wire-sources');
if(!chips||!list)return;
var sel='ALL',data=null;
function ago(iso){var s=(Date.now()-new Date(iso).getTime())/1e3;if(s<3600)return Math.max(1,Math.round(s/60))+' MIN AGO';if(s<86400)return Math.round(s/3600)+'H AGO';return Math.round(s/86400)+'D AGO'}
function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
function drawChips(){chips.innerHTML='';REGIONS.forEach(function(r){var b=document.createElement('button');b.type='button';b.textContent=r==='ALL'?'ALL REGIONS':r;b.setAttribute('aria-pressed',sel===r?'true':'false');b.style.cssText='font-family:JetBrains Mono,monospace;font-size:10px;letter-spacing:1px;padding:8px 16px;border-radius:22px;cursor:pointer;min-height:36px;'+(sel===r?'background:#0A0B14;color:#F7F1E8;border:1px solid #0A0B14;':'background:#fff;color:#3a3a3a;border:1px solid #E0DACE;');b.onclick=function(){sel=r;drawChips();draw()};chips.appendChild(b)})}
function draw(){if(!data)return;var items=data.items.filter(function(i){return sel==='ALL'||i.region===sel});list.innerHTML='';if(!items.length){list.innerHTML='<div style="border:2px dashed #c9b89a;border-radius:10px;padding:34px;text-align:center"><div style="font-family:Playfair Display,serif;font-weight:800;font-size:19px;color:#0A0B14;margin-bottom:6px">Quiet on this desk today.</div><div style="font-family:IBM Plex Sans Condensed,sans-serif;font-size:13px;color:#6B6660">Nothing from this region in the last 48 hours.</div></div>';return}
items.forEach(function(i){var c=document.createElement('div');c.style.cssText='background:#fff;border:1px solid #E0DACE;border-radius:10px;padding:18px 22px;display:flex;gap:18px;flex-wrap:wrap;';var tag=RC[i.region]||'#4a4d63';var cn=cname(i.country);c.innerHTML='<div style="flex:none;width:110px"><span style="display:inline-block;font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:1px;color:#fff;background:'+tag+';padding:3px 9px;border-radius:4px">'+esc(i.region)+'</span>'+(cn?'<div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.5px;color:#6B6660;margin-top:6px">'+esc(cn.toUpperCase())+'</div>':'')+'</div><div style="flex:1;min-width:240px"><div style="font-family:Playfair Display,serif;font-weight:800;font-size:18px;line-height:1.25;color:#0A0B14;margin-bottom:6px">'+esc(i.title)+'</div>'+(i.summary?'<div style="font-family:IBM Plex Sans Condensed,sans-serif;font-size:14px;line-height:1.5;color:#3a3a3a;margin-bottom:9px">'+esc(i.summary)+'</div>':'')+'<div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:1px;color:#6B6660">'+esc(i.source)+' · '+ago(i.publishedAt)+' · <a href="'+i.link+'" target="_blank" rel="noopener" style="color:#067A79;font-weight:600;text-decoration:none">READ AT SOURCE ↗</a></div></div>';list.appendChild(c)})}
fetch(EP+'?limit=60').then(function(r){return r.json()}).then(function(j){j.items=curate(j.items||[]);data=j;status.textContent='UPDATED '+new Date(j.updatedAt).toUTCString().slice(17,22)+' UTC · '+j.items.length+' HEADLINES ON THE WIRE';var names={};j.items.forEach(function(i){names[i.source]=1});srcs.textContent='SOURCES ON THE WIRE: '+Object.keys(names).join(' · ')+' · AGGREGATED HEADLINES AND LINKS ONLY. NO SCRAPED BODIES. EVERY CLICK GOES TO THE PEOPLE WHO DID THE REPORTING.';drawChips();draw()}).catch(function(){status.textContent='THE WIRE IS RESTING. TRY A REFRESH.'});
drawChips();
})();
</script>
