<div data-ep="contact">
<section class="ep-sec" id="ep-contact" aria-labelledby="ep-contact-h"><h2 class="ep-eb" id="ep-contact-h">06 · How people reach you</h2>
<p class="ep-lede">Pick what the Get in touch button does. Phone numbers are never shown. Email only if you choose it.</p>
<div class="ep-opts" role="radiogroup" aria-label="Contact method">
<button type="button" class="ep-opt" role="radio" aria-checked="true" data-ep-contact="relay"><span><b>Relay form</b><small>Readers write to you through TLL. Nobody sees your email until you reply.</small></span></button>
<button type="button" class="ep-opt" role="radio" aria-checked="false" data-ep-contact="instagram"><span><b>Instagram DM</b><small>The button opens your Instagram. Needs your Instagram link in 03.</small></span></button>
<button type="button" class="ep-opt" role="radio" aria-checked="false" data-ep-contact="email"><span><b>Show my email</b><small>Written as name [at] domain on your page, with a real mail link behind it.</small></span></button>
<button type="button" class="ep-opt" role="radio" aria-checked="false" data-ep-contact="off"><span><b>No contact</b><small>No button on your page. Your stories still carry your byline.</small></span></button>
</div>
<div class="ep-field" data-ep-emailwrap hidden><label class="ep-label" for="ep-f-email">Public email</label><input class="ep-input" type="email" id="ep-f-email" data-ep-f="email" autocomplete="email"><p class="ep-note">Shown on your page by your choice. Saved to your public profile only.</p></div></section>
</div>
