<style id="tll-ep-css-c">
/* 3.4 (21 Oct 2026): developing card, 88 px photo button, contributions, crew rows, expat desks, grayscale preview */
.ep-dev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border:1.5px solid #D9D2C5;border-radius:10px;background:#FDF9F3;padding:16px 18px;margin:0 0 20px}

.ep-crew-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ep-wait{font:600 12px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:1px;color:#7A4D10}

/* UX build (26 Oct 2026, U1 to U12): small section labels, hidden means hidden, member bar first, the bar that follows the page, saved marks, labeled desks */
:is(#tll-ep,[data-ep]) .ep-eb{font:600 12px/1.4 'JetBrains Mono',ui-monospace,monospace !important;letter-spacing:3px !important;text-transform:uppercase !important;color:#067A79 !important}

.ep-sec{scroll-margin-top:150px}

.ep-bar{position:fixed;left:0;right:0;top:var(--ep-bar-top,0px);z-index:60;background:#F7F1E8;border-bottom:1.5px solid #0A0B14;box-shadow:0 4px 12px rgba(10,11,20,.06);font-family:'IBM Plex Sans Condensed',system-ui,sans-serif}

/* Signed-in fix (26 Oct 2026): the site core CSS sets html.ms-loaded [data-ms-content="members"] to display:block, which beat the page grid for every signed-in member (the page showed as one wide column since 20 Oct), and the grid rule beat the core's display:none before Memberstack loaded (the empty form flashed at login). Hidden until Memberstack has loaded, then the grid. */
.tll-edit-container [data-ms-content="members"]{display:none !important}
html.ms-loaded .tll-edit-container [data-ms-content="members"]{display:grid !important}
.ep-dir .ep-mono{margin-left:10px}
.ep-eb span{font:inherit !important;letter-spacing:1.5px !important;color:#6B6660 !important}
