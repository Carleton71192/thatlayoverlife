<script id="tll-ep-js-c">
/* Edit profile v2, script part C: input wiring, the debounced 900 ms save and the status line. Every change goes to the Memberstack custom fields through the DOM package; when data-worker on #tll-ep is set it also goes to POST {worker}/profile/save with the member token, and only then does the line say LIVE. */
(function(E){
var $=E.$,$$=E.$$;var root=document.getElementById("tll-ep");if(!root||!E||!E.set)return;
var WORKER=(root.getAttribute("data-worker")||"").replace(/\/$/,"");
var dirty={},timer=null,savedAt=0,live=false,busy=false,st=$("[data-ep-status]");
function status(t,state){if(st){st.textContent=t;st.setAttribute("data-state",state||"")}}
function tick(){if(!savedAt||busy)return;var n=Math.max(0,Math.round((Date.now()-savedAt)/1000));status("Saved "+n+" s ago"+(live?" · live":""),"ok")}
setInterval(tick,1000);
E.onChange(function(k,v){dirty[k]=v;clearTimeout(timer);timer=setTimeout(flush,900);status("Saving…","busy")});
function flush(){timer=null;var d=dirty;dirty={};var keys=Object.keys(d);if(!keys.length)return;busy=true;status("Saving…","busy");
 var m=E.ms(),cfs={};keys.forEach(function(k){var mk=(k in E.MSKEY)?E.MSKEY[k]:k;if(mk)cfs[mk]=d[k]});
 var p=(m&&m.updateMember&&Object.keys(cfs).length)?m.updateMember({customFields:cfs}):Promise.resolve();
 p.then(function(){if(!WORKER){savedAt=Date.now();live=false;return}var tok=E.token();if(!tok)throw new Error("no token");var body={fields:{}};keys.forEach(function(k){body.fields[k]=E.BOOL[k]?d[k]==="true":d[k]});
  return fetch(WORKER+"/profile/save",{method:"POST",keepalive:true,headers:{"content-type":"application/json","authorization":"Bearer "+tok},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||"save");savedAt=Date.parse(j.savedAt)||Date.now();live=true})})
 }).then(function(){busy=false;tick()}).catch(function(){busy=false;keys.forEach(function(k){if(!(k in dirty))dirty[k]=d[k]});status("Not saved. Check your connection and type again.","fail")})}
window.addEventListener("pagehide",function(){if(timer){clearTimeout(timer);flush()}});
/* the Memberstack inputs that stay in place */
["name","home-base","bio-long","bio-short"].forEach(function(k){var f=E.msField(k);if(f)f.addEventListener("input",function(){E.set(k,f.value)})});
/* the new inputs */
var wrap=root.closest('[data-ms-content="members"]')||document;
wrap.addEventListener("input",function(e){var t=e.target,k=t&&t.getAttribute&&t.getAttribute("data-ep-f");if(k)E.set(k,t.value)});
wrap.addEventListener("click",function(e){var b=e.target.closest("[data-ep-credit],[data-ep-link],[data-ep-contact],[data-ep-list],[data-ep-vis],[data-ep-rmflag],[data-ep-rmlang]");if(!b)return;
 if(b.hasAttribute("data-ep-credit"))E.set("credit-mode",b.getAttribute("data-ep-credit"));
 else if(b.hasAttribute("data-ep-link")){var key=b.getAttribute("data-ep-link"),on=E.LINKS.map(function(l){return l[0]===key?!E.rowOn(l[0]):E.rowOn(l[0])});E.set("links-shown",on.every(Boolean)?"":E.LINKS.filter(function(l,i){return on[i]}).map(function(l){return l[0]}).join(","))}
 else if(b.hasAttribute("data-ep-contact"))E.set("contact-mode",b.getAttribute("data-ep-contact"));
 else if(b.hasAttribute("data-ep-list")){var k=b.getAttribute("data-ep-list");E.set(k,E.get(k)==="true"?"false":"true")}
 else if(b.hasAttribute("data-ep-vis"))E.set("visibility",b.getAttribute("data-ep-vis"));
 else if(b.hasAttribute("data-ep-rmflag"))E.set("from-and-lived-in",E.list(E.get("from-and-lived-in")).filter(function(c){return c!==b.getAttribute("data-ep-rmflag")}).join(","));
 else if(b.hasAttribute("data-ep-rmlang"))E.set("languages",E.list(E.get("languages")).filter(function(l){return l!==b.getAttribute("data-ep-rmlang")}).join(", "));
});
var rg=$("[data-ep-ranges]");if(rg)rg.addEventListener("change",function(){E.set("share-ranges",rg.checked?"true":"false")});
var cq=$("[data-ep-countryq]"),fnote=$("[data-ep-flagnote]");if(cq)cq.addEventListener("keydown",function(e){if(e.key!=="Enter")return;e.preventDefault();var c=E.ccode(cq.value),cur=E.list(E.get("from-and-lived-in"));if(!c){if(fnote){fnote.setAttribute("data-hold","1");fnote.textContent="No country by that name. Try the English name or its two letter code."}return}if(fnote)fnote.removeAttribute("data-hold");cq.value="";if(cur.length>=5||cur.indexOf(c)>-1){E.paint();return}cur.push(c);E.set("from-and-lived-in",cur.join(","))});
/* Languages: the world's languages (ISO 639-1 names plus Cantonese, Mandarin, Filipino, Greenlandic and sign languages). Enter accepts only a name on the list (Nancy, 21 Oct 2026: "World languages please"). An entry saved before this rule shows as "not on the list" until it is changed. */
E.LANGS="Abkhazian,Afar,Afrikaans,Akan,Albanian,American Sign Language,Amharic,Arabic,Aragonese,Armenian,Assamese,Avaric,Aymara,Azerbaijani,Bambara,Bashkir,Basque,Belarusian,Bengali,Bislama,Bosnian,Breton,Bulgarian,Burmese,Cantonese,Catalan,Chamorro,Chechen,Chichewa,Chinese,Chuvash,Cornish,Corsican,Cree,Croatian,Czech,Danish,Divehi,Dutch,Dzongkha,English,Esperanto,Estonian,Ewe,Faroese,Fijian,Filipino,Finnish,French,Fulah,Galician,Georgian,German,Greek,Greenlandic,Guarani,Gujarati,Haitian Creole,Hausa,Hebrew,Herero,Hindi,Hiri Motu,Hungarian,Icelandic,Igbo,Indonesian,Inuktitut,Inupiaq,Irish,Italian,Japanese,Javanese,Kannada,Kanuri,Kashmiri,Kazakh,Khmer,Kikuyu,Kinyarwanda,Kirghiz,Komi,Kongo,Korean,Kurdish,Kwanyama,Lao,Latin,Latvian,Limburgish,Lingala,Lithuanian,Luba-Katanga,Luxembourgish,Macedonian,Malagasy,Malay,Malayalam,Maltese,Mandarin,Manx,Maori,Marathi,Marshallese,Mongolian,Nauru,Navajo,Ndonga,Nepali,North Ndebele,Northern Sami,Norwegian,Occitan,Ojibwa,Oriya,Oromo,Ossetian,Pashto,Persian,Polish,Portuguese,Punjabi,Quechua,Romanian,Romansh,Rundi,Russian,Samoan,Sango,Sanskrit,Sardinian,Scottish Gaelic,Serbian,Shona,Sign language,Sindhi,Sinhala,Slovak,Slovenian,Somali,South Ndebele,Southern Sotho,Spanish,Sundanese,Swahili,Swati,Swedish,Tagalog,Tahitian,Tajik,Tamil,Tatar,Telugu,Thai,Tibetan,Tigrinya,Tonga,Tsonga,Tswana,Turkish,Turkmen,Twi,Uighur,Ukrainian,Urdu,Uzbek,Venda,Vietnamese,Walloon,Welsh,Western Frisian,Wolof,Xhosa,Yiddish,Yoruba,Zhuang,Zulu".split(",");
E.langOk=function(v){v=String(v||"").trim().toLowerCase();return E.LANGS.some(function(x){return x.toLowerCase()===v})};
E.langFix=function(v){v=String(v||"").trim().toLowerCase();for(var i=0;i<E.LANGS.length;i++)if(E.LANGS[i].toLowerCase()===v)return E.LANGS[i];return null};
var ld=$("#ep-languages");if(ld&&!ld.children.length)ld.innerHTML=E.LANGS.map(function(l){return '<option value="'+l+'">'}).join("");
var lq=$("[data-ep-langq]"),lnote=$("[data-ep-langnote]");
function langSay(t){if(!lnote)return;lnote.textContent=t;lnote.setAttribute("data-hold","1");setTimeout(function(){lnote.removeAttribute("data-hold");E.paint&&E.paint()},4000)}
if(lq)lq.addEventListener("keydown",function(e){if(e.key!=="Enter")return;e.preventDefault();var v=lq.value.trim().replace(/,/g,"");if(!v)return;var name=E.langFix(v);if(!name){langSay("Not on the list. Pick a language from the list.");return}var cur=E.list(E.get("languages"));if(cur.length>=10){langSay("Ten is the limit. Remove one to add another.");return}if(!cur.some(function(x){return x.toLowerCase()===name.toLowerCase()}))cur.push(name);lq.value="";E.set("languages",cur.join(", "))});
var ph=$("#ep-f-photo");if(ph)ph.addEventListener("change",function(){var f=ph.files&&ph.files[0],m=E.ms();if(!f)return;if(!m||!m.updateMemberProfileImage){status("Change your photo from /account for now.","fail");return}busy=true;status("Uploading photo…","busy");m.updateMemberProfileImage({profileImage:f}).then(function(r){if(r&&r.data)E.member=r.data;busy=false;savedAt=Date.now();E.paintPreview();tick()}).catch(function(){busy=false;status("That photo did not upload. Try a smaller one.","fail")})});
/* boot: fill from Memberstack, then mirror the four inputs the Memberstack form fills itself */
var n=0,iv=setInterval(function(){var m=E.ms();if(!m){if(++n>40)clearInterval(iv);return}clearInterval(iv);
 m.getCurrentMember().then(function(r){if(!r||!r.data)return;E.fill(r.data);
  if(m.getMemberJSON)return m.getMemberJSON().then(function(j){var s=j&&j.data&&j.data.tllSnapshot;if(s&&typeof s==="object"){E.snapshot=s;E.paintPreview()}}).catch(function(){})}).catch(function(){});
 var k=0,iv2=setInterval(function(){var f=E.msField("name");if((f&&f.value)||++k>24){clearInterval(iv2);["name","home-base","bio-long","bio-short"].forEach(function(key){var el=E.msField(key);if(el&&el.value&&E.get(key)!==el.value)E.S[key]=el.value});E.paint()}},250);
},200);
})(window.TLLEP);
</script>
