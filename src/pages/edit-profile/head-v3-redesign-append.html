<style id="tll-edit-v3">
/* Edit profile v3 (9 Oct 2026, Nancy: "The edit page still has not gone through its redesign"). Layout and skin only: every field, id, name and data-ms-* attribute stays where it is. Desktop: a sticky rail (live name card, section index, Save) beside a single column of numbered cards. Phone: one column, rail on top. Brand kit: Cream page, Ink type, Rose action, Teal eyebrows; Playfair 800 titles, Plex Sans Condensed body, JetBrains Mono labels. */
.tll-edit-section{background:#F7F1E8 !important;padding-top:clamp(28px,6vh,56px) !important}
.tll-edit-container{max-width:1180px !important}

.tll-edit-sub{font-size:16px !important;line-height:1.55;color:#6B6660 !important;max-width:56ch;margin:0}

[data-tll-edit-rail]{grid-column:1;grid-row:2/span 40;position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}

[data-tll-edit-rail] .tll-rail-name{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:22px;line-height:1.1;margin:0 0 4px;color:#F7F1E8;overflow-wrap:anywhere}
[data-tll-edit-rail] .tll-rail-ft{font-size:13px;line-height:1.4;color:#cfcbc4;margin:0;min-height:1.4em}

[data-tll-edit-rail] nav a i{font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:1px;color:#067A79;width:20px;flex:none}

.tll-edit-input{width:100%;box-sizing:border-box;min-height:46px;padding:11px 14px !important;border:1.5px solid #D9CFBD !important;border-radius:10px !important;background:#FDF9F3 !important;color:#0A0B14 !important;font:500 15px/1.4 'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif !important;box-shadow:none !important;transition:border-color .15s ease,box-shadow .15s ease}

.tll-edit-input:hover{border-color:#0A0B14 !important}
.tll-edit-input:focus{outline:none;border-color:#0A0B14 !important;box-shadow:0 0 0 3px rgba(214,56,89,.3) !important}
.tll-edit-textarea{min-height:110px;resize:vertical}
.tll-edit-helptext{display:block;font-size:12.5px;color:#6B6660;margin:6px 0 0;font-style:normal !important}
.tll-edit-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
.tll-edit-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.tll-edit-field[data-tll-countries-field]{display:none}
.tll-edit-countries-note{font-size:13px;color:#6B6660;margin:-8px 0 18px;line-height:1.5;padding:10px 12px;border-left:3px solid #00C9C8;background:#FDF9F3;border-radius:0 8px 8px 0}
.tll-edit-toggles{display:flex;flex-direction:column}
.tll-edit-toggle{display:flex !important;align-items:center;gap:12px;min-height:50px;padding:6px 0 !important;margin:0 !important;border-top:1px solid #EEE7DA;cursor:pointer;font-size:15px;font-weight:600;color:#0A0B14}

.tll-edit-toggle input[type="checkbox"]:focus-visible{outline:3px solid #D63859;outline-offset:2px}
.tll-edit-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 24px !important}
.tll-edit-save{height:50px !important;padding:0 24px !important;border-radius:999px !important;background:#D63859 !important;color:#fff !important;font:700 13px 'JetBrains Mono',ui-monospace,monospace !important;letter-spacing:1.5px;text-transform:uppercase;border:0 !important;cursor:pointer;transition:transform .12s ease,background .15s ease}
.tll-edit-save:hover{background:#B3122F !important}.tll-edit-save:active{transform:scale(.98)}
.tll-edit-actions a{font-size:14px;color:#6B6660;text-decoration:underline;text-underline-offset:3px}

.tll-edit-form .w-form-done{background:#E3F6F5;color:#0A0B14;border:1px solid #9ADEDC}

[data-tll-edit="dir-lede"]{font-size:14px !important;color:#6B6660 !important;margin:0 0 18px !important}
[data-tll-edit="desig-grid"]{margin-top:18px}
[data-tll-edit="desig-card"]{background:#FDF9F3 !important;border:1px solid #E0DACE !important}
[data-tll-edit="desig-apply"]{border-radius:999px !important;padding:11px 16px !important}
[data-tll-edit="desig-apply"]:focus-visible,[data-tll-edit="desig-what"]:focus-visible{outline:3px solid #D63859;outline-offset:2px}
[data-tll-edit="desig-note"]{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif !important;font-size:13px !important;letter-spacing:0 !important;line-height:1.5 !important}
.tlled-toggle label b{font-size:18px}

.tlled-save:hover{background:#B3122F}.tlled-save:active{transform:scale(.98)}
.tlled-save:focus-visible,.tlled-chip:focus-visible{outline:3px solid #D63859;outline-offset:2px}
.tll-edit-account-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 0 8px;border-top:1px solid #E0DACE}
.tll-edit-account-actions .tll-h3{font-family:'JetBrains Mono',ui-monospace,monospace !important;font-size:10px !important;letter-spacing:2px;text-transform:uppercase;color:#6B6660 !important;font-weight:600 !important;margin:0 8px 0 0 !important}
.tll-edit-account-actions a{font-size:14px;color:#0A0B14;text-decoration:underline;text-underline-offset:3px}
.tll-edit-account-actions a:focus-visible{outline:3px solid #D63859;outline-offset:2px}
.tll-edit-divider{color:#c9b89a}

  [data-tll-edit="ledger-link"]{grid-column:1;grid-row:auto;justify-self:start;margin-top:12px}
  .tll-edit-fieldset,[data-tll-edit="dir"],[data-tll-edit="desig"]{padding:20px 18px 18px !important}
