<!-- tll-dir-js-v2 · /creators (1 November 2026, Nancy: "Add MAKES to the /creators cards"; handoff/CHANGE-LOG-CREATORS-MAKES-2026-11-01.md).
     The hidden source list on this page now reads the Contributors collection (Make things on, Visibility Public) instead of the hand-filled
     Directory collection, so the cards are the members' own profiles. Each source card carries the profile as data attributes (name, credit mode,
     pen name, one line, makes, contact mode, the ten links, links shown, partners). The script keeps the v1 shell:
     shuffled on every load, never ranked, a search box, the Contact open filter, a chip row (now What they make), "Report this profile" on every
     card, the sample card when the list is short. New on the card: "MAKES PHOTOS · VIDEO · WORDS" under the one line, and OPEN TO PARTNERSHIPS
     when the member switched it on. Contact on a card: only an Instagram button, for members whose contact mode is Instagram. The relay form
     left the site on 31 October 2026 (Phase 0), and an email address is never put on a card, so every other mode has no button here; the
     visitor reaches the member through the profile. Not bound to the card: languages, home base and flags, which the profile does not show
     (home base only when the member switches it on), so the search here cannot find what the page cannot show. -->
<style id="tll-dir-makes-v1">
.tlldir-makes{font:600 10.5px/1.4 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#067A79;margin:0}
.tlldir-sub:empty{display:none}
</style>
<script>
(function(){
  var root=document.querySelector('[data-tll-dir-page]'); if(!root) return;
  var MODE=root.getAttribute('data-tll-dir-page');
  var NOUN={expats:'EXPAT',creators:'CREATOR',press:'JOURNALIST'}[MODE]||'MEMBER';
  var MAKES=['photos','video','words','sound','other'];
  var LINKS=[['instagram','Instagram','IG','ig'],['youtube','YouTube','YT','yt'],['website','Website','WEB',''],['tiktok','TikTok','TT','tt'],['substack','Substack','SUB',''],['strava','Strava','SS','ss'],['alltrails','AllTrails','AT',''],['komoot','Komoot','KM',''],['garmin','Garmin','GR',''],['beli','Beli','BELI','']];
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var list=function(s){return String(s||'').split(/[\s,]+/).map(function(x){return x.trim()}).filter(Boolean)};
  var url=function(u){u=String(u||'').trim();return /^https?:\/\/\S+$/i.test(u)?u:''};
  /* the name as the member chose to be credited: full, first name only, or pen name (the real name is not rendered) */
  function shownName(d){var n=String(d.name||'').trim(),c=String(d.credit||'').toLowerCase();if(c==='pen')return String(d.pen||'').trim()||'Traveler';if(c==='first')return n.split(/\s+/)[0]||n;return n}
  var srcNodes=[].slice.call(document.querySelectorAll('[data-tll-dir]'));
  var people=srcNodes.map(function(n){
    var d=n.dataset, img=n.querySelector('img'), partners=null;
    try{partners=JSON.parse(d.partners||'null')}catch(e){partners=null}
    var shown=list(d.linksShown).map(function(k){return k.toLowerCase()});
    var links=[];LINKS.forEach(function(l){var u=url(d['link'+l[0].charAt(0).toUpperCase()+l[0].slice(1)]);if(!u)return;if(shown.length&&shown.indexOf(l[0])<0)return;links.push({key:l[0],label:l[1],short:l[2],cls:l[3],url:u})});
    var makes=list(d.makes).map(function(m){return m.toLowerCase()}).filter(function(m){return MAKES.indexOf(m)>-1});
    return {name:shownName(d),slug:String(d.slug||'').trim(),line:String(d.line||'').trim(),makes:MAKES.filter(function(m){return makes.indexOf(m)>-1}),
      cmode:String(d.cmode||'relay').toLowerCase(),links:links,ig:url(d.linkInstagram),
      open:!!(partners&&typeof partners==='object'&&partners.open===true),
      photo:(img&&!/w-dyn-bind-empty/.test(img.className)&&img.getAttribute('src'))||''};
  }).filter(function(p){return p.name&&p.slug});
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  shuffle(people);
  var grid=root.querySelector('[data-tll-dir-grid]'), count=root.querySelector('[data-tll-dir-count]'), search=root.querySelector('[data-tll-dir-search]'), tagrow=root.querySelector('[data-tll-dir-tags]');
  var state={q:'',contact:false,tag:''};
  /* Instagram mode opens their Instagram. Every other mode has no button on a card: the relay form is gone and an address never sits here. */
  function contactHref(p){return p.cmode==='instagram'&&p.ig?p.ig:''}
  function makeWord(m){return m==='other'?'OTHER THINGS':m.toUpperCase()}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function card(p){
    var sub=esc(p.line);
    var makes=p.makes.length?'<p class="tlldir-makes">MAKES '+p.makes.map(makeWord).join(' · ')+'</p>':'';
    var tags=p.open?'<span class="tlldir-tag tlldir-tag--amber">Open to partnerships</span>':'';
    var links=p.links.slice(0,4).map(function(l){return '<a class="tlldir-badge tlldir-badge--'+l.cls+'" href="'+esc(l.url)+'" target="_blank" rel="noopener nofollow ugc" aria-label="'+esc(l.label)+', opens in a new tab">'+l.short+'</a>'}).join('');
    var ch=contactHref(p);
    var contact=ch?'<a class="tlldir-contact" href="'+esc(ch)+'" target="_blank" rel="noopener nofollow ugc" aria-label="Contact open, opens Instagram in a new tab">Contact open</a>':'';
    var av=p.photo?'<img src="'+esc(p.photo)+'" alt="" loading="lazy">':esc(Array.from(p.name)[0]||'');
    var nm='<a href="/contributors/'+esc(p.slug)+'">'+esc(p.name)+'</a>';
    return '<article class="tlldir-card"><div class="tlldir-top"><div class="tlldir-avatar">'+av+'</div><div><h3 class="tlldir-name">'+nm+'</h3><p class="tlldir-sub">'+sub+'</p>'+makes+'</div></div>'+(tags?'<div class="tlldir-tags">'+tags+'</div>':'')+'<div class="tlldir-links">'+links+contact+'</div><a class="tlldir-report" href="mailto:hello@thatlayover.life?subject='+encodeURIComponent('REPORT · /contributors/'+p.slug+' · /'+MODE)+'">Report this profile</a></article>';
  }
  function invite(){return '<article class="tlldir-card tlldir-card--invite"><span class="tlldir-sample">Sample · not a member</span><div class="tlldir-top"><div class="tlldir-plus">+</div><div><h3 class="tlldir-name">Your name here</h3><p class="tlldir-sub">Road trips on film, one country at a time</p><p class="tlldir-makes">MAKES PHOTOS · VIDEO</p></div></div><p class="tlldir-sub">You make travel things? Switch on Make things in your profile and say what you make.</p><a class="tlldir-invite-link" href="/edit-profile">Put yourself on the map →</a></article>'}
  function apply(){
    var q=state.q.trim().toLowerCase();
    var out=people.filter(function(p){
      if(q){var hay=[p.name,p.line,p.makes.map(makeWord).join(' ')].join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false;}
      if(state.contact&&!contactHref(p)) return false;
      if(state.tag&&p.makes.indexOf(state.tag)<0) return false;
      return true;
    });
    var n=out.length,all=people.length,narrowed=!!(q||state.contact||state.tag);
    /* the count names the whole list; a narrowed grid reads "2 of 8" so the number never reads as the directory's size */
    if(count) count.innerHTML='<span>'+(narrowed?n+' of '+all+' '+NOUN+(all===1?'':'S'):all+' '+NOUN+(all===1?'':'S')+' on the map')+' · shuffled</span><span>No rankings. No counts that rank people.</span>';
    var html=out.map(card).join('');
    if(all<3&&!narrowed) html+=invite();
    grid.innerHTML=html;
  }
  if(tagrow){
    /* the chip row lists what the people here make, in the fixed order; a chip narrows the grid to that */
    var present=MAKES.filter(function(m){return m!=='other'&&people.some(function(p){return p.makes.indexOf(m)>-1})});
    tagrow.innerHTML=present.map(function(m){return '<button type="button" class="tlldir-chip" aria-pressed="false" data-tag="'+m+'">'+cap(m)+'</button>'}).join('');
    var lab=tagrow.previousElementSibling; if(lab){lab.textContent='WHAT THEY MAKE';lab.style.display=present.length?'':'none'}
    tagrow.addEventListener('click',function(e){var b=e.target.closest('[data-tag]'); if(!b) return; var on=b.getAttribute('aria-pressed')==='true'; [].forEach.call(tagrow.children,function(c){c.setAttribute('aria-pressed','false')}); state.tag=on?'':b.dataset.tag; if(!on) b.setAttribute('aria-pressed','true'); apply();});
  }
  root.querySelectorAll('[data-tll-dir-filter]').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();var k=b.dataset.tllDirFilter; state[k]=!state[k]; b.setAttribute('aria-pressed',String(state[k])); apply();})});
  if(search) search.addEventListener('input',function(){state.q=search.value; apply();});
  apply();
})();
</script>
