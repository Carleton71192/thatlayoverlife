<style id="tll-foot-v1">
/* Footer layout, Packet A items A2.1 and A2.6 (20 Oct 2026, prototype 3.3). Desktop: the four columns sit in one row, 14px links, 44px rows.
   Phones: each column is an accordion with a 52px header and 44px rows. Lives in the footer component next to the counts embed. */
footer[data-tll-canonical-footer] [class^="inline-div-7-"]{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 32px}
footer[data-tll-canonical-footer] [class^="inline-div-7-"]>div{min-width:0;margin:0}
footer[data-tll-canonical-footer] [class^="inline-div-7-"] a{display:block;font-size:14px;line-height:1.3;min-height:32px;margin:0;padding:6px 0;box-sizing:border-box} /* 21 Oct 2026: 32px rows on desktop, class margins off (they stacked to 54px); 44px rows stay on phones below */
footer[data-tll-canonical-footer] [class^="inline-div-7-"] h4{margin:0 0 6px}
@media(max-width:767px){
footer[data-tll-canonical-footer] [class^="inline-div-7-"]{display:block}
footer[data-tll-canonical-footer] [class^="inline-div-7-"]>div{border-top:1px solid rgba(247,241,232,.14)}
footer[data-tll-canonical-footer] [class^="inline-div-7-"] h4{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin:0;cursor:pointer}
footer[data-tll-canonical-footer] [class^="inline-div-7-"] h4::after{content:"+";font-weight:400;font-size:18px}
footer[data-tll-canonical-footer] [class^="inline-div-7-"]>div[data-tll-open="true"] h4::after{content:"\2013"}
footer[data-tll-canonical-footer] [class^="inline-div-7-"]>div:not([data-tll-open="true"])>a{display:none}
footer[data-tll-canonical-footer] [class^="inline-div-7-"] a{min-height:44px;padding:10px 0}
footer[data-tll-canonical-footer] [class^="inline-div-7-"] h4:focus-visible{outline:3px solid #00C9C8;outline-offset:2px}
}
/* Story From line (A7.2): "From {City}, {Country} · {Pursuit}". The comma and the dot only print when the part has text. */
.st3-from{margin-top:6px;font-size:13px;line-height:1.4}
.st3-from [data-st3-from-part="city"]:not(:empty)::after{content:", "}
.st3-from [data-st3-from-part="pursuit"]:not(:empty)::before{content:" \00b7 "}
.st3-from a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.st3-from a:empty{display:none}
#tll-note [data-tll-note-desk]{font:600 12px/1.3 'JetBrains Mono',ui-monospace,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#9496AC}
#tll-note input[type=hidden]{display:none}
.tll-comm-tag{color:#C8325B}
.tll-comm-tag::before{content:" \00b7 ";color:inherit}
a[data-tll-commissioned="story"]{display:none;align-items:center;min-height:44px;margin:0 0 4px;font:700 12px/1.4 'JetBrains Mono',ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:#C8325B;text-decoration:none}
a[data-tll-commissioned="story"].tll-comm-on{display:inline-flex}
a[data-tll-commissioned="story"]:hover{text-decoration:underline;text-underline-offset:3px}
.tll-auth-section .tll-auth-eyebrow,.tll-auth-section .tll-auth-card-eyebrow,.tll-auth-section .tll-auth-divider,.tll-auth-section .tll-auth-field label,.tll-forgot-section .tll-auth-field label,.tll-forgot-section .tll-forgot-eyebrow,.au3-eye{font-size:12px!important} /* beta B6.5: 12px floor on /signup, /login, /forgot-password */
</style>
<script>
/* Footer accordions on phones: the column heading toggles its links, with Enter and Space on the keyboard. Desktop ignores the clicks. */
(function(){function run(){var F=document.querySelector('footer[data-tll-canonical-footer]');if(!F||F.dataset.tllFoot)return;F.dataset.tllFoot='1';var row=F.querySelector('[class^="inline-div-7-"]');if(!row)return;var mq=window.matchMedia('(max-width:767px)');[].forEach.call(row.children,function(col){var h=col.querySelector('h4');if(!h)return;h.setAttribute('role','button');h.setAttribute('tabindex','0');h.setAttribute('aria-expanded','false');function t(){var o=col.getAttribute('data-tll-open')==='true';col.setAttribute('data-tll-open',o?'false':'true');h.setAttribute('aria-expanded',o?'false':'true')}h.addEventListener('click',function(){if(mq.matches)t()});h.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&mq.matches){e.preventDefault();t()}})})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run()})();
/* The Data API cannot set input placeholders (Webflow ships "Example Text"), so the widget's two placeholders are written here. */
(function(){function p(){var a=document.getElementById('tll-note-text'),b=document.getElementById('tll-note-email');if(a)a.placeholder='A typo, a wrong flag, a story that needs a look.';if(b)b.placeholder='Email, if you want a reply (optional)';}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',p);else p()})();
/* From line hrefs (A7.2): the story page script already writes href = data-st3-base + data-st3-slug on every [data-st3-slug] link. Seven Places slugs differ from the Countries hub slugs, so those are mapped here; Taiwan has no hub page and becomes plain text. Runs after that script, on DOMContentLoaded and again on load. */
(function(){var M={turkey:'turkiye','georgia-country':'georgia','cote-divoire':'ivory-coast','democratic-republic-of-the-congo':'dr-congo',congo:'republic-of-the-congo','cabo-verde':'cape-verde'},NO={taiwan:1};function fix(){[].forEach.call(document.querySelectorAll('a[data-st3-from-part="country"][data-st3-slug]'),function(a){var s=a.getAttribute('data-st3-slug')||'';if(NO[s]){var sp=document.createElement('span');sp.textContent=a.textContent;a.parentNode.replaceChild(sp,a);return}if(M[s])a.href='/countries/'+M[s];else if(s&&a.getAttribute('href')==='/countries')a.href='/countries/'+s});[].forEach.call(document.querySelectorAll('a[data-st3-from-part="pursuit"][data-st3-slug]'),function(a){var s=a.getAttribute('data-st3-slug')||'';if(s&&/^[a-z0-9-]+$/.test(s)&&a.getAttribute('href')==='/stories')a.href='/pillars/'+s})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix);else fix();window.addEventListener('load',fix)})();
/* Commissioned label (beta B4.1, 20 Oct 2026). Story cards and the story page carry a hidden [data-tll-commissioned] marker (Webflow drops it when the switch is off; it also ignores conditional visibility on the story link, so the link stays hidden until the marker is there) whose Webflow visibility is bound to the
   Stories switch "commissioned"; when it renders without w-condition-invisible the card meta gets "Commissioned by TLL". The home rail builds its own
   cards, so it reads the markers from /stories. Runs again after page scripts that rewrite card meta. */
(function(){var L='Commissioned by TLL';function on(m){return !!(m&&!m.classList.contains('w-condition-invisible'));}
function tag(meta){if(!meta||meta.querySelector('.tll-comm-tag'))return;var s=document.createElement('span');s.className='tll-comm-tag';s.textContent=L;meta.appendChild(s);}
function cards(){[].forEach.call(document.querySelectorAll('a[data-tll-card]'),function(c){if(on(c.querySelector('[data-tll-commissioned]')))tag(c.querySelector('.tll-lib-meta'));});
[].forEach.call(document.querySelectorAll('[data-pf5="story-card"]'),function(c){if(on(c.querySelector('[data-tll-commissioned]')))tag(c.querySelector('[data-pf5="card-meta"]'));});}
var set=null;function home(){if(!document.querySelector('.h3-card'))return;if(set){[].forEach.call(document.querySelectorAll('.h3-card'),function(c){if(set[c.getAttribute('data-slug')])tag(c.querySelector('.h3-card-meta'));});return;}
set={};fetch('/stories').then(function(r){return r.ok?r.text():'';}).then(function(h){if(!h)return;var d=new DOMParser().parseFromString(h,'text/html');[].forEach.call(d.querySelectorAll('a[data-tll-card]'),function(a){if(on(a.querySelector('[data-tll-commissioned]'))){var s=((a.getAttribute('href')||'').match(/\/stories\/([^/?#]+)/)||[])[1];if(s)set[s]=1;}});home();}).catch(function(){});}
function story(){var a=document.querySelector('a[data-tll-commissioned="story"]');if(a&&on(document.querySelector('[data-tll-commissioned="marker"]')))a.classList.add('tll-comm-on');}
function run(){story();cards();home();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();window.addEventListener('load',function(){run();setTimeout(run,1500);});})();
</script>
