<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="FONTS_CSS">
<style>
:root{--ink:#0A0B14;--cream:#F7F1E8;--rose:#F0507A;--teal:#00C9C8;--mute:#B9C0D0}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--ink);color:var(--cream);font-family:'IBM Plex Sans Condensed',sans-serif}
.card{position:relative;width:1200px;height:630px;overflow:hidden}
.photo{position:absolute;top:0;bottom:0;left:300px;right:0;background-size:cover;background-position:var(--pos,50% 50%)}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,#0A0B14 0%,#0A0B14 41%,rgba(10,11,20,.86) 50%,rgba(10,11,20,.25) 64%,rgba(10,11,20,0) 78%)}
.scrim2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,20,0) 72%,rgba(10,11,20,.55) 100%)}
.plain .photo,.plain .scrim,.plain .scrim2{display:none}
.plain::after{content:"";position:absolute;right:-180px;top:-180px;width:620px;height:620px;border-radius:50%;border:2px solid rgba(0,201,200,.28)}
.plain::before{content:"";position:absolute;right:-60px;top:-60px;width:380px;height:380px;border-radius:50%;border:2px solid rgba(240,80,122,.45)}
.in{position:absolute;left:72px;top:72px;right:72px;bottom:64px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;letter-spacing:4px;text-transform:uppercase;color:var(--teal)}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:66px;line-height:1.04;letter-spacing:-.025em;max-width:600px;text-wrap:balance;padding-bottom:6px;color:var(--cream)}
h1 em{font-style:italic;color:var(--rose)}
.plain h1{font-size:88px;max-width:900px}
.foot{display:flex;align-items:flex-end;justify-content:space-between}
.mark{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--cream)}
.mark i{font-style:italic;font-weight:800;margin-right:8px}
.mark b{color:var(--rose)}
.url{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
</style></head><body>
<div class="card CLASS" style="--pos:POS"><div class="photo" style="background-image:url('PHOTO')"></div><div class="scrim"></div><div class="scrim2"></div>
<div class="in"><div><div class="eyebrow">EYEBROW</div><h1 style="margin-top:28px">HEADLINE</h1></div>
<div class="foot"><div><div class="mark"><i>that</i>LAYOVER <b>LIFE.</b></div><div class="url" style="margin-top:10px">thatlayover.life</div></div></div></div></div>
</body></html>
